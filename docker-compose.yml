include:
  - docker-compose.deps.yml

services:
  lunogram:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: dev
        COMMIT: local
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      POSTGRES_URI: postgres://postgres:postgrespw@postgres:5432/management?sslmode=disable
      USERS_POSTGRES_URI: postgres://postgres:postgrespw@postgres:5432/users?sslmode=disable
      JOURNEY_POSTGRES_URI: postgres://postgres:postgrespw@postgres:5432/journey?sslmode=disable
      REDIS_ADDRESS: redis://redis:6379
      NATS_URL: nats://nats:4222
      # Authentication
      AUTH_DRIVER: ${AUTH_DRIVER:-basic}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-dev-secret-change-in-production}
      AUTH_BASIC_EMAIL: ${AUTH_BASIC_EMAIL:-admin@localhost}
      AUTH_BASIC_PASSWORD: ${AUTH_BASIC_PASSWORD:-admin}
      AUTH_CLERK_SECRET_KEY: ${AUTH_CLERK_SECRET_KEY:-}
      AUTH_CLERK_WEBHOOK_SECRET: ${AUTH_CLERK_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - app_network
