include:
  - docker-compose.deps.yml

services:
  lunogram:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: dev
        COMMIT: local
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      POSTGRES_MANAGEMENT_URI: postgres://postgres:postgrespw@postgres:5432/management?sslmode=disable
      POSTGRES_SUBJECTS_URI: postgres://postgres:postgrespw@postgres:5432/subjects?sslmode=disable
      POSTGRES_JOURNEY_URI: postgres://postgres:postgrespw@postgres:5432/journey?sslmode=disable
      RBAC_POSTGRES_URI: postgres://postgres:postgrespw@postgres:5432/rbac?sslmode=disable
      REDIS_ADDRESS: redis://redis:6379
      NATS_URL: nats://nats:4222
      # Authentication. AUTH_DRIVER takes a comma-separated list, so a
      # deployment can offer several login methods at once — for example
      # "basic,clerk" while an organization migrates onto SSO.
      AUTH_DRIVER: ${AUTH_DRIVER:-basic}
      # Signs the console session token (ES256). The default below is a PUBLICLY
      # KNOWN development key: anyone holding it can mint a valid console session
      # for any admin, so a real deployment MUST set its own. Generate one with:
      #   openssl ecparam -name prime256v1 -genkey -noout
      # There is deliberately no auto-generated fallback in the server: an
      # ephemeral key would log every admin out on restart and would break a
      # multi-replica deployment silently.
      AUTH_CONSOLE_SIGNING_KEY: ${AUTH_CONSOLE_SIGNING_KEY:------BEGIN EC PRIVATE KEY-----\nMHcCAQEEIG6W7Oa4GaiOyuS/Fo18FOUVb840oWDlAC8cJuB2IuW8oAoGCCqGSM49\nAwEHoUQDQgAEwXeD5bykWmYlPbqqoxk0hUjxwp+DEyU+HPo0q/OCly3HHGk+yS9w\nck0TgwNlj1B6bKTJwKVmkeL76aKDuBFmQg==\n-----END EC PRIVATE KEY-----}
      # Seeds the first admin account on the first boot: the pair is written
      # into a real admin with the password hashed, not compared against on every
      # login. The plaintext is needed once — a later boot never overwrites a
      # stored password, so a restart cannot undo one changed in the console.
      # The password is held to the same policy as one chosen in the console --
      # it becomes a real stored owner credential -- so the development default
      # is a passphrase rather than "admin". It is PUBLICLY KNOWN: set your own
      # before this is reachable by anybody else.
      AUTH_BASIC_EMAIL: ${AUTH_BASIC_EMAIL:-admin@localhost}
      AUTH_BASIC_PASSWORD: ${AUTH_BASIC_PASSWORD:-change-this-development-password}
      # Who else may create an account: open, invite_only or disabled.
      # invite_only is the default and additionally admits the very first
      # account, which nobody could have invited.
      AUTH_BASIC_REGISTRATION: ${AUTH_BASIC_REGISTRATION:-invite_only}
      # Add oidc to AUTH_DRIVER above to offer single sign-on alongside the
      # password login, and fill these in from your identity provider. The
      # redirect URI to register with it is
      # PUBLIC_URL + /api/auth/oidc/default/callback. Several providers are
      # declared in a configuration file instead -- see the README.
      AUTH_OIDC_ISSUER: ${AUTH_OIDC_ISSUER:-}
      AUTH_OIDC_CLIENT_ID: ${AUTH_OIDC_CLIENT_ID:-}
      AUTH_OIDC_CLIENT_SECRET: ${AUTH_OIDC_CLIENT_SECRET:-}
      # The rest have defaults. They are forwarded anyway because a provider
      # that publishes its metadata somewhere unusual, or names its claims
      # differently, cannot be configured at all from a compose file otherwise.
      AUTH_OIDC_DISCOVERY_URL: ${AUTH_OIDC_DISCOVERY_URL:-}
      AUTH_OIDC_SCOPES: ${AUTH_OIDC_SCOPES:-}
      AUTH_OIDC_ALLOWED_DOMAINS: ${AUTH_OIDC_ALLOWED_DOMAINS:-}
      AUTH_OIDC_EMAIL_CLAIM: ${AUTH_OIDC_EMAIL_CLAIM:-}
      AUTH_OIDC_EMAIL_VERIFIED_CLAIM: ${AUTH_OIDC_EMAIL_VERIFIED_CLAIM:-}
      AUTH_OIDC_GIVEN_NAME_CLAIM: ${AUTH_OIDC_GIVEN_NAME_CLAIM:-}
      AUTH_OIDC_FAMILY_NAME_CLAIM: ${AUTH_OIDC_FAMILY_NAME_CLAIM:-}
      # Add saml to AUTH_DRIVER above for a directory that does not speak
      # OpenID Connect. The assertion consumer service URL to register is
      # PUBLIC_URL + /api/auth/saml/default/acs, and the metadata most
      # providers will read it from is PUBLIC_URL + /api/auth/saml/default/metadata.
      # PUBLIC_URL has to be https for this driver -- see the README.
      #
      # Set the metadata URL, or the sign-on URL and certificate, not both.
      AUTH_SAML_ENTITY_ID: ${AUTH_SAML_ENTITY_ID:-}
      AUTH_SAML_METADATA_URL: ${AUTH_SAML_METADATA_URL:-}
      AUTH_SAML_SSO_URL: ${AUTH_SAML_SSO_URL:-}
      AUTH_SAML_CERTIFICATE: ${AUTH_SAML_CERTIFICATE:-}
      # This deployment's own key pair, needed only by a provider that wants
      # signed requests or encrypts its assertions. Both or neither.
      AUTH_SAML_SP_ENTITY_ID: ${AUTH_SAML_SP_ENTITY_ID:-}
      AUTH_SAML_SP_CERTIFICATE: ${AUTH_SAML_SP_CERTIFICATE:-}
      AUTH_SAML_SP_PRIVATE_KEY: ${AUTH_SAML_SP_PRIVATE_KEY:-}
      # The rest have defaults, forwarded for the same reason the OpenID
      # Connect ones are: a directory whose attributes are named unusually
      # cannot be configured from a compose file otherwise.
      AUTH_SAML_ALLOWED_DOMAINS: ${AUTH_SAML_ALLOWED_DOMAINS:-}
      AUTH_SAML_EMAIL_ATTRIBUTE: ${AUTH_SAML_EMAIL_ATTRIBUTE:-}
      AUTH_SAML_GIVEN_NAME_ATTRIBUTE: ${AUTH_SAML_GIVEN_NAME_ATTRIBUTE:-}
      AUTH_SAML_FAMILY_NAME_ATTRIBUTE: ${AUTH_SAML_FAMILY_NAME_ATTRIBUTE:-}
      AUTH_SAML_NAME_ID_FORMAT: ${AUTH_SAML_NAME_ID_FORMAT:-}
      AUTH_CLERK_SECRET_KEY: ${AUTH_CLERK_SECRET_KEY:-}
      AUTH_CLERK_WEBHOOK_SECRET: ${AUTH_CLERK_WEBHOOK_SECRET:-}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-}
      # Account confirmation and password reset mail. The quickstart sends to
      # the mailpit service below, where every message is readable at
      # http://localhost:8025 — nothing leaves the machine and no SMTP account
      # is needed to create, confirm and recover an account.
      #
      # There is no channel that only logs: a deployment offering password
      # logins has to say where its mail goes, and one that does not is refused
      # at boot rather than at the first registration.
      MAIL_CHANNEL: ${MAIL_CHANNEL:-smtp}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@localhost}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Lunogram}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-mailpit}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-1025}
      MAIL_SMTP_USERNAME: ${MAIL_SMTP_USERNAME:-}
      MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-}
      # starttls, implicit or none. Mailpit is on the compose network and offers
      # no TLS; a real relay must not be set to none.
      MAIL_SMTP_TLS: ${MAIL_SMTP_TLS:-none}
      # Public URL used to generate user-facing links (e.g. preference center, unsubscribe)
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - app_network

  renderer:
    build:
      context: ./renderer
      dockerfile: Dockerfile
    environment:
      NATS_URL: nats://nats:4222
    depends_on:
      nats:
        condition: service_started
    networks:
      - app_network
