openapi: 3.0.3
info:
  title: Lunogram Webhooks
  description: Webhook event payloads sent by Lunogram
  version: 1.0.0

paths:
  /webhooks/project/created:
    post:
      summary: Project Created Webhook
      description: |
        Called when a new project is created.

        The request carries only the hook's own configured credential. Earlier releases forwarded the
        triggering API caller's headers, including their Authorization header; that is no longer done,
        because it handed the receiver the caller's full API privileges. Receivers authenticate calls
        back to the Lunogram management API with their own credential, and read the triggering identity
        from the `actor` block available to the body template.
      operationId: projectCreatedWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreatedEvent"
      responses:
        "200":
          description: Event processed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResponse"

components:
  schemas:
    ProjectCreatedEvent:
      type: object
      required:
        - event
        - timestamp
        - project
      properties:
        event:
          type: string
          enum: [project.created]
          description: The event type
        timestamp:
          type: string
          format: date-time
          description: When the event occurred (UTC)
        project:
          $ref: "#/components/schemas/ProjectDetails"

    ProjectDetails:
      type: object
      required:
        - id
        - organization_id
        - name
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: The project's unique identifier
        organization_id:
          type: string
          format: uuid
          description: The organization the project belongs to
        name:
          type: string
          description: The project name
        timezone:
          type: string
          description: The project's timezone (e.g., "America/New_York")
        locale:
          type: string
          description: The project's locale (e.g., "en")
        created_at:
          type: string
          format: date-time
          description: When the project was created (UTC)

    WebhookResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, error]
        message:
          type: string
          description: Optional message, typically used for error details
