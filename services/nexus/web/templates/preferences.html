<!DOCTYPE html>
<html lang="{{.Locale}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
            background-color: #f9fafb;
            min-height: 100vh;
            padding: 2rem 1rem;
            line-height: 1.6;
        }
        .container {
            max-width: 42rem;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 0.5rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            padding: 2rem;
        }
        h1 {
            font-size: 1.875rem;
            font-weight: 700;
            color: #111827;
            margin-bottom: 1rem;
        }
        .description {
            color: #6b7280;
            margin-bottom: 2rem;
        }
        .alert-success {
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 0.375rem;
            padding: 1rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: flex-start;
        }
        .alert-success svg {
            width: 1.25rem;
            height: 1.25rem;
            color: #22c55e;
            margin-right: 0.75rem;
            flex-shrink: 0;
        }
        .alert-success p {
            color: #166534;
            font-size: 0.875rem;
        }
        .subscription-list {
            margin-bottom: 1.5rem;
        }
        .subscription-item {
            display: flex;
            align-items: flex-start;
            padding: 1rem;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            margin-bottom: 0.75rem;
            transition: background-color 0.2s;
        }
        .subscription-item:hover {
            background-color: #f9fafb;
        }
        .subscription-item input[type="checkbox"] {
            width: 1.25rem;
            height: 1.25rem;
            margin-top: 0.125rem;
            cursor: pointer;
            accent-color: #2563eb;
        }
        .subscription-item label {
            margin-left: 0.75rem;
            flex: 1;
            cursor: pointer;
        }
        .subscription-name {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #111827;
            margin-bottom: 0.125rem;
        }
        .subscription-channel {
            display: block;
            font-size: 0.75rem;
            color: #6b7280;
            text-transform: capitalize;
        }
        button[type="submit"] {
            width: 100%;
            background-color: #2563eb;
            color: white;
            font-weight: 500;
            padding: 0.75rem 1rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s;
            font-size: 1rem;
        }
        button[type="submit"]:hover {
            background-color: #1d4ed8;
        }
        button[type="submit"]:focus {
            outline: 2px solid #2563eb;
            outline-offset: 2px;
        }
        .empty-state {
            text-align: center;
            padding: 2rem 0;
        }
        .empty-state svg {
            width: 3rem;
            height: 3rem;
            margin: 0 auto 1rem;
            color: #9ca3af;
        }
        .empty-state p {
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>{{.Title}}</h1>
            <p class="description">{{.Description}}</p>
            
            {{if .ShowSuccessMessage}}
            <div class="alert-success">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <p>{{.SuccessMessage}}</p>
            </div>
            {{end}}

            {{if .Subscriptions}}
            <form method="POST" action="/preferences/{{.ProjectID}}/{{.UserID}}">
                <div class="subscription-list">
                    {{range .Subscriptions}}
                    <div class="subscription-item">
                        <input 
                            type="checkbox" 
                            name="subscriptionIds" 
                            value="{{.SubscriptionID}}"
                            id="sub-{{.SubscriptionID}}"
                            {{if eq .State "subscribed"}}checked{{end}}
                        />
                        <label for="sub-{{.SubscriptionID}}">
                            <span class="subscription-name">{{.Name}}</span>
                            <span class="subscription-channel">{{.Channel}}</span>
                        </label>
                    </div>
                    {{end}}
                </div>
                
                <button type="submit">{{.SaveButtonText}}</button>
            </form>
            {{else}}
            <div class="empty-state">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/>
                </svg>
                <p>{{.NoSubscriptionsText}}</p>
            </div>
            {{end}}
        </div>
    </div>
</body>
</html>
