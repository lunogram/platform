<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Communication Preferences</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="bg-gray-50 min-h-screen py-8 px-4">
    <div class="max-w-2xl mx-auto">
        <div class="bg-white rounded-lg shadow-md p-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-4">Communication Preferences</h1>
            <p class="text-gray-600 mb-8">Choose which methods of communication you would like to continue to receive:</p>
            
            {{if .ShowSuccessMessage}}
            <div class="bg-green-50 border border-green-200 rounded-md p-4 mb-6 flex items-start">
                <svg class="w-5 h-5 text-green-400 mr-3 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <p class="text-sm text-green-800">Your preferences have been updated!</p>
            </div>
            {{end}}

            {{if .Subscriptions}}
            <form method="POST" action="/preferences/{{.ProjectID}}/{{.UserID}}" class="space-y-4">
                {{range .Subscriptions}}
                <div class="flex items-start p-4 border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors">
                    <input 
                        type="checkbox" 
                        name="subscriptionIds" 
                        value="{{.SubscriptionID}}"
                        id="sub-{{.SubscriptionID}}"
                        {{if eq .State "subscribed"}}checked{{end}}
                        class="w-5 h-5 text-blue-600 border-gray-300 rounded focus:ring-blue-500 mt-0.5"
                    />
                    <label for="sub-{{.SubscriptionID}}" class="ml-3 flex-1 cursor-pointer">
                        <span class="block text-sm font-medium text-gray-900">{{.Name}}</span>
                        <span class="block text-xs text-gray-500 capitalize">{{.Channel}}</span>
                    </label>
                </div>
                {{end}}
                
                <div class="pt-4">
                    <button 
                        type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
                    >
                        Save Preferences
                    </button>
                </div>
            </form>
            {{else}}
            <div class="text-center py-8">
                <svg class="mx-auto w-12 h-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/>
                </svg>
                <p class="mt-4 text-gray-600">You are not subscribed to any notifications.</p>
            </div>
            {{end}}
        </div>
    </div>
</body>
</html>
