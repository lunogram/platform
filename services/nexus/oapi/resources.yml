        description:
          type: string
          example: "Updated description"
        timezone:
          type: string
          example: "America/Los_Angeles"
        locale:
          type: string
          example: "es-ES"
        text_opt_out_message:
          type: string
          example: "Reply STOP to unsubscribe"
        text_help_message:
          type: string
          example: "Reply HELP for assistance"
        link_wrap_email:
          type: boolean
          example: true
        link_wrap_push:
          type: boolean
          example: true
        tools:
          type: array
          items:
            type: string
          example: ["analytics", "reporting"]

    CreateCampaign:
      type: object
      required:
        - name
        - channel
      properties:
        name:
          type: string
          example: "Welcome Campaign"
        channel:
          type: string
          enum: [email, sms, push]
