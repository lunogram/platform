openapi: 3.0.3
info:
  title: Lunogram Platform API
  description: API for managing campaigns, templates, and providers
  version: 1.0.0

paths:
  /api/admin/projects/{projectID}/campaigns:
    get:
      summary: List campaigns
      description: Retrieves a list of campaigns with optional filtering
      operationId: listCampaigns
      tags:
        - Campaigns
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          $ref: '#/components/responses/CampaignListResponse'
        default:
          $ref: '#/components/responses/Error'

    post:
      summary: Create campaign
      description: Creates a new campaign
      operationId: createCampaign
      tags:
        - Campaigns
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCampaign'
      responses:
        '201':
          description: Campaign created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        default:
          $ref: '#/components/responses/Error'

  /api/admin/projects/{projectID}/campaigns/{campaignID}:
    get:
      summary: Get campaign by ID
      description: Retrieves a specific campaign with its templates and provider information
      operationId: getCampaign
      tags:
        - Campaigns
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: campaignID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The campaign ID
      responses:
        '200':
          description: Campaign retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Campaign'
        default:
          $ref: '#/components/responses/Error'
    
    patch:
      summary: Update campaign
      description: Updates campaign properties such as name and provider
      operationId: updateCampaign
      tags:
        - Campaigns
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: campaignID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The campaign ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCampaign'
      responses:
        '200':
          description: Campaign updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        default:
          $ref: '#/components/responses/Error'
    
  /api/admin/projects/{projectID}/campaigns/{campaignID}/templates:
    post:
      summary: Create template
      description: Creates a new template for a campaign
      operationId: createTemplate
      tags:
        - Templates
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: campaignID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The campaign ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTemplate'
      responses:
        '201':
          description: Template created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        default:
          $ref: '#/components/responses/Error'

  /api/admin/projects/{projectID}/campaigns/{campaignID}/templates/{templateID}:
    get:
      summary: Get template by ID
      description: Retrieves a specific template with its content and editor data
      operationId: getTemplate
      tags:
        - Templates
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: campaignID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The campaign ID
        - name: templateID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The template ID
      responses:
        '200':
          description: Template retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Template'
        default:
          $ref: '#/components/responses/Error'

    patch:
      summary: Update template
      description: Updates template properties and content
      operationId: updateTemplate
      tags:
        - Templates
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: campaignID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The campaign ID
        - name: templateID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The template ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTemplate'
      responses:
        '200':
          description: Template updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        default:
          $ref: '#/components/responses/Error'

    delete:
      summary: Delete template
      description: Deletes a template
      operationId: deleteTemplate
      tags:
        - Templates
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: campaignID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The campaign ID
        - name: templateID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The template ID
      responses:
        '204':
          description: Template deleted successfully
        default:
          $ref: '#/components/responses/Error'

  /api/admin/projects/{projectID}/campaigns/{campaignID}/duplicate:
    post:
      summary: Duplicate campaign
      description: Creates a copy of the campaign with all its templates
      operationId: duplicateCampaign
      tags:
        - Campaigns
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: campaignID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The campaign ID to duplicate
      responses:
        '201':
          description: Campaign duplicated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        default:
          $ref: '#/components/responses/Error'

  /api/admin/projects/{projectID}/campaigns/{campaignID}/users:
    get:
      summary: Get campaign users
      description: Retrieves the list of users associated with a campaign
      operationId: getCampaignUsers
      tags:
        - Campaigns
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: campaignID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The campaign ID
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Campaign users retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - total
                  - limit
                  - offset
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CampaignUser'
                  total:
                    type: integer
                    minimum: 0
                  limit:
                    type: integer
                  offset:
                    type: integer
        default:
          $ref: '#/components/responses/Error'

  /api/admin/projects:
    get:
      summary: List projects
      description: Retrieves a paginated list of projects accessible to the authenticated admin
      operationId: listProjects
      tags:
        - Projects
      security:
        - HttpBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Projects retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
        default:
          $ref: '#/components/responses/Error'

    post:
      summary: Create project
      description: Creates a new project
      operationId: createProject
      tags:
        - Projects
      security:
        - HttpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProject'
      responses:
        '201':
          description: Project created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          $ref: '#/components/responses/Error'

  /api/admin/projects/{projectID}:
    get:
      summary: Get project by ID
      description: Retrieves a specific project
      operationId: getProject
      tags:
        - Projects
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
      responses:
        '200':
          description: Project retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          $ref: '#/components/responses/Error'

    patch:
      summary: Update project
      description: Updates project properties
      operationId: updateProject
      tags:
        - Projects
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProject'
      responses:
        '200':
          description: Project updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          $ref: '#/components/responses/Error'

  /api/admin/projects/{projectID}/journeys:
    get:
      summary: List journeys
      description: Retrieves a paginated list of journeys for a project
      operationId: listJourneys
      tags:
        - Journeys
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          $ref: '#/components/responses/JourneyListResponse'
        default:
          $ref: '#/components/responses/Error'

    post:
      summary: Create journey
      description: Creates a new journey
      operationId: createJourney
      tags:
        - Journeys
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJourney'
      responses:
        '201':
          description: Journey created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journey'
        default:
          $ref: '#/components/responses/Error'

  /api/admin/projects/{projectID}/journeys/{journeyID}:
    get:
      summary: Get journey by ID
      description: Retrieves a specific journey
      operationId: getJourney
      tags:
        - Journeys
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: journeyID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The journey ID
      responses:
        '200':
          description: Journey retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journey'
        default:
          $ref: '#/components/responses/Error'
    
    patch:
      summary: Update journey
      description: Updates journey properties such as name, description, and status
      operationId: updateJourney
      tags:
        - Journeys
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: journeyID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The journey ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateJourney'
      responses:
        '200':
          description: Journey updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journey'
        default:
          $ref: '#/components/responses/Error'
    
    delete:
      summary: Delete journey
      description: Soft deletes a journey
      operationId: deleteJourney
      tags:
        - Journeys
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: journeyID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The journey ID
      responses:
        '204':
          description: Journey deleted successfully
        default:
          $ref: '#/components/responses/Error'

  /api/admin/profile:
    get:
      summary: Get current admin profile
      description: Retrieves the profile information for the authenticated admin user
      operationId: getProfile
      tags:
        - Admins
      security:
        - HttpBearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'
        default:
          $ref: '#/components/responses/Error'

  /api/admin/organizations/admins:
    get:
      summary: List organization admins
      description: Retrieves a paginated list of admins in the organization
      operationId: listAdmins
      tags:
        - Admins
      security:
        - HttpBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Admins retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminList'
        default:
          $ref: '#/components/responses/Error'

    post:
      summary: Create or update admin
      description: Creates a new admin or updates an existing one if the email already exists
      operationId: createAdmin
      tags:
        - Admins
      security:
        - HttpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdmin'
      responses:
        '201':
          description: Admin created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'
        default:
          $ref: '#/components/responses/Error'

  /api/admin/organizations/admins/{adminID}:
    get:
      summary: Get admin by ID
      description: Retrieves a specific admin
      operationId: getAdmin
      tags:
        - Admins
      security:
        - HttpBearerAuth: []
      parameters:
        - name: adminID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The admin ID
      responses:
        '200':
          description: Admin retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'
        default:
          $ref: '#/components/responses/Error'

    patch:
      summary: Update admin
      description: Updates admin properties such as role and name
      operationId: updateAdmin
      tags:
        - Admins
      security:
        - HttpBearerAuth: []
      parameters:
        - name: adminID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The admin ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdmin'
      responses:
        '200':
          description: Admin updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'
        default:
          $ref: '#/components/responses/Error'

    delete:
      summary: Delete admin
      description: Deletes an admin from the organization
      operationId: deleteAdmin
      tags:
        - Admins
      security:
        - HttpBearerAuth: []
      parameters:
        - name: adminID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The admin ID
      responses:
        '204':
          description: Admin deleted successfully
        default:
          $ref: '#/components/responses/Error'

  /api/admin/organizations:
    get:
      summary: Get current organization
      description: Retrieves the current organization for the authenticated admin
      operationId: getOrganization
      tags:
        - Organizations
      security:
        - HttpBearerAuth: []
      responses:
        '200':
          description: Organization retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        default:
          $ref: '#/components/responses/Error'

    patch:
      summary: Update organization
      description: Updates organization properties (requires owner role)
      operationId: updateOrganization
      tags:
        - Organizations
      security:
        - HttpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganization'
      responses:
        '200':
          description: Organization updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        default:
          $ref: '#/components/responses/Error'

    delete:
      summary: Delete organization
      description: Soft deletes the current organization (requires owner role)
      operationId: deleteOrganization
      tags:
        - Organizations
      security:
        - HttpBearerAuth: []
      responses:
        '204':
          description: Organization deleted successfully
        default:
          $ref: '#/components/responses/Error'

  /api/admin/organizations/integrations:
    get:
      summary: Get organization integrations
      description: Retrieves all provider integrations for the organization
      operationId: getOrganizationIntegrations
      tags:
        - Organizations
      security:
        - HttpBearerAuth: []
      responses:
        '200':
          description: Integrations retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Provider'
        default:
          $ref: '#/components/responses/Error'

  /api/admin/projects/{projectID}/users:
    get:
      summary: List users
      description: Retrieves a paginated list of users in a project
      operationId: listUsers
      tags:
        - Users
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        default:
          $ref: '#/components/responses/Error'

    post:
      summary: Identify user
      description: Creates or updates a user by anonymous_id or external_id
      operationId: identifyUser
      tags:
        - Users
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentifyUser'
      responses:
        '200':
          description: User identified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'

  /api/admin/projects/{projectID}/users/{userID}:
    get:
      summary: Get user by ID
      description: Retrieves a specific user
      operationId: getUser
      tags:
        - Users
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: userID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The user ID
      responses:
        '200':
          description: User retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'

    patch:
      summary: Update user
      description: Updates user properties
      operationId: updateUser
      tags:
        - Users
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: userID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The user ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUser'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'

    delete:
      summary: Delete user
      description: Deletes a user from the project
      operationId: deleteUser
      tags:
        - Users
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: userID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The user ID
      responses:
        '204':
          description: User deleted successfully
        default:
          $ref: '#/components/responses/Error'

  /api/admin/projects/{projectID}/users/{userID}/events:
    get:
      summary: Get user events
      description: Retrieves events for a specific user
      operationId: getUserEvents
      tags:
        - Users
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: userID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The user ID
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: User events retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEventList'
        default:
          $ref: '#/components/responses/Error'

  /api/admin/projects/{projectID}/users/{userID}/subscriptions:
    get:
      summary: Get user subscriptions
      description: Retrieves subscriptions for a specific user
      operationId: getUserSubscriptions
      tags:
        - Users
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: userID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The user ID
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
