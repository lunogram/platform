openapi: 3.0.3
info:
  title: Lunogram Platform API
  description: API for managing campaigns, templates, and providers
  version: 1.0.0

paths:
  /api/admin/projects/{projectID}/campaigns:
    get:
      summary: List campaigns
      description: Retrieves a list of campaigns with optional filtering
      operationId: listCampaigns
      tags:
        - Campaigns
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          $ref: '#/components/responses/CampaignListResponse'
        default:
          $ref: '#/components/responses/Error'

    post:
      summary: Create campaign
      description: Creates a new campaign
      operationId: createCampaign
      tags:
        - Campaigns
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCampaign'
      responses:
        '201':
          description: Campaign created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        default:
          $ref: '#/components/responses/Error'

  /api/admin/projects/{projectID}/campaigns/{campaignID}:
    get:
      summary: Get campaign by ID
      description: Retrieves a specific campaign with its templates and provider information
      operationId: getCampaign
      tags:
        - Campaigns
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: campaignID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The campaign ID
      responses:
        '200':
          description: Campaign retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Campaign'
        default:
          $ref: '#/components/responses/Error'
    
    patch:
      summary: Update campaign
      description: Updates campaign properties such as name and provider
      operationId: updateCampaign
      tags:
        - Campaigns
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: campaignID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The campaign ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCampaign'
      responses:
        '200':
          description: Campaign updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        default:
          $ref: '#/components/responses/Error'
    
    delete:
      summary: Delete campaign
      description: Deletes a campaign and all its associated templates
      operationId: deleteCampaign
      tags:
        - Campaigns
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: campaignID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The campaign ID
      responses:
        '204':
          description: Campaign deleted successfully
        default:
          $ref: '#/components/responses/Error'

  /api/admin/projects/{projectID}/campaigns/{campaignID}/duplicate:
    post:
      summary: Duplicate campaign
      description: Creates a copy of the campaign with all its templates
      operationId: duplicateCampaign
      tags:
        - Campaigns
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: campaignID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The campaign ID to duplicate
      responses:
        '201':
          description: Campaign duplicated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        default:
          $ref: '#/components/responses/Error'

  /api/admin/projects/{projectID}/campaigns/{campaignID}/users:
    get:
      summary: Get campaign users
      description: Retrieves the list of users associated with a campaign
      operationId: getCampaignUsers
      tags:
        - Campaigns
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: campaignID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The campaign ID
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Campaign users retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - total
                  - limit
                  - offset
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CampaignUser'
                  total:
                    type: integer
                    minimum: 0
                  limit:
                    type: integer
                  offset:
                    type: integer
        default:
          $ref: '#/components/responses/Error'

  /api/admin/profile:
    get:
      summary: Get current admin profile
      description: Retrieves the profile information for the authenticated admin user
      operationId: getProfile
      tags:
        - Admins
      security:
        - HttpBearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'
        default:
          $ref: '#/components/responses/Error'

  /api/admin/organizations/admins:
    get:
      summary: List organization admins
      description: Retrieves a paginated list of admins in the organization
      operationId: listAdmins
      tags:
        - Admins
      security:
        - HttpBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Admins retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminList'
        default:
          $ref: '#/components/responses/Error'

    post:
      summary: Create or update admin
      description: Creates a new admin or updates an existing one if the email already exists
      operationId: createAdmin
      tags:
        - Admins
      security:
        - HttpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdmin'
      responses:
        '201':
          description: Admin created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'
        default:
          $ref: '#/components/responses/Error'

  /api/admin/organizations/admins/{adminID}:
    get:
      summary: Get admin by ID
      description: Retrieves a specific admin
      operationId: getAdmin
      tags:
        - Admins
      security:
        - HttpBearerAuth: []
      parameters:
        - name: adminID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The admin ID
      responses:
        '200':
          description: Admin retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'
        default:
          $ref: '#/components/responses/Error'

    patch:
      summary: Update admin
      description: Updates admin properties such as role and name
      operationId: updateAdmin
      tags:
        - Admins
      security:
        - HttpBearerAuth: []
      parameters:
        - name: adminID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The admin ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdmin'
      responses:
        '200':
          description: Admin updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'
        default:
          $ref: '#/components/responses/Error'

    delete:
      summary: Delete admin
      description: Deletes an admin from the organization
      operationId: deleteAdmin
      tags:
        - Admins
      security:
        - HttpBearerAuth: []
      parameters:
        - name: adminID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The admin ID
      responses:
        '204':
          description: Admin deleted successfully
        default:
          $ref: '#/components/responses/Error'

  /api/admin/projects/{projectID}/users:
    get:
      summary: List users
      description: Retrieves a paginated list of users in a project
      operationId: listUsers
      tags:
        - Users
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        default:
          $ref: '#/components/responses/Error'

    post:
      summary: Identify user
      description: Creates or updates a user by anonymous_id or external_id
      operationId: identifyUser
      tags:
        - Users
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentifyUser'
      responses:
        '200':
          description: User identified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'

  /api/admin/projects/{projectID}/users/{userID}:
    get:
      summary: Get user by ID
      description: Retrieves a specific user
      operationId: getUser
      tags:
        - Users
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: userID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The user ID
      responses:
        '200':
          description: User retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'

    patch:
      summary: Update user
      description: Updates user properties
      operationId: updateUser
      tags:
        - Users
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: userID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The user ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUser'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'

    delete:
      summary: Delete user
      description: Deletes a user from the project
      operationId: deleteUser
      tags:
        - Users
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: userID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The user ID
      responses:
        '204':
          description: User deleted successfully
        default:
          $ref: '#/components/responses/Error'

  /api/admin/projects/{projectID}/users/{userID}/events:
    get:
      summary: Get user events
      description: Retrieves events for a specific user
      operationId: getUserEvents
      tags:
        - Users
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: userID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The user ID
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: User events retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEventList'
        default:
          $ref: '#/components/responses/Error'

  /api/admin/projects/{projectID}/users/{userID}/subscriptions:
    get:
      summary: Get user subscriptions
      description: Retrieves subscriptions for a specific user
      operationId: getUserSubscriptions
      tags:
        - Users
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: userID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The user ID
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: User subscriptions retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSubscriptionList'
        default:
          $ref: '#/components/responses/Error'

    patch:
      summary: Update user subscriptions
      description: Updates subscription states for a user
      operationId: updateUserSubscriptions
      tags:
        - Users
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: userID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The user ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserSubscriptions'
      responses:
        '200':
          description: User subscriptions updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'

  /api/admin/projects/{projectID}/users/{userID}/journeys:
    get:
      summary: Get user journeys
      description: Retrieves journey entrances for a specific user
      operationId: getUserJourneys
      tags:
        - Users
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: userID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The user ID
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: User journeys retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserJourneyList'
        default:
          $ref: '#/components/responses/Error'

components:
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        x-go-type: PaginationLimit
      description: Maximum number of items to return
    
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
        x-go-type: PaginationOffset
      description: Number of items to skip
    
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
        x-go-type: PaginationSearch
      description: Search query string

  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    
    CampaignListResponse:
      description: Campaigns retrieved successfully
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PaginatedResponse'
              - type: object
                required:
                  - results
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Campaign'

  schemas:
    Problem:
      type: object
      required:
        - title
        - detail
      properties:
        title:
          type: string
          description: |
            A short summary of the problem type. Written in English and readable for engineers, usually not suited for non technical stakeholders and not localized.
          example: some title for the error situation
        detail:
          type: string
          description: |
            A human readable explanation specific to this occurrence of the problem that is helpful to locate the problem and give advice on how to proceed. Written in English and readable for engineers, usually not suited for non technical stakeholders and not localized.
          example: some description for the error situation

    PaginatedResponse:
      type: object
      required:
        - total
        - limit
        - offset
      properties:
        total:
          type: integer
          description: Total number of items matching the filters
          example: 42
        limit:
          type: integer
          description: Maximum number of items returned
          example: 20
        offset:
          type: integer
          description: Number of items skipped
          example: 0

    UserList:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          required:
            - results
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/User'

    AdminList:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          required:
            - results
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/Admin'

    CreateCampaign:
      type: object
      required:
        - name
        - channel
      properties:
        name:
          type: string
          example: "Welcome Campaign"
        channel:
          type: string
          enum: [email, sms, push]
          example: "email"
        provider_id:
          type: string
          format: uuid
          example: "5143f27c-cca9-4dc4-9059-e1dbb08144ad"
        subscription_id:
          type: string
          format: uuid

    UpdateCampaign:
      type: object
      properties:
        name:
          type: string
          example: "epic hopper"
        provider_id:
          type: string
          format: uuid
          example: "5143f27c-cca9-4dc4-9059-e1dbb08144ad"

    Campaign:
      type: object
      required:
        - id
        - name
        - project_id
        - channel
        - templates
        - delivery
        - created_at
        - updated_at
      properties:
        created_at:
          type: string
          format: date-time
          example: "2025-11-19T14:18:42.960Z"
        updated_at:
          type: string
          format: date-time
          example: "2025-11-23T17:20:00.021Z"
        id:
          type: string
          format: uuid
          example: "52f3f921-1343-48af-b795-87c0fd3b44aa"
        project_id:
          type: string
          format: uuid
        name:
          type: string
          example: "Welcome to the program!"
        channel:
          type: string
          enum: [email, sms, push]
          example: "email"
        subscription_id:
          type: string
          format: uuid
        provider:
          $ref: '#/components/schemas/Provider'
        templates:
          type: array
          items:
            $ref: '#/components/schemas/Template'
        delivery:
          $ref: '#/components/schemas/Delivery'

    Delivery:
      type: object
      required:
        - sent
        - opens
        - total
        - clicks
      properties:
        sent:
          type: integer
          example: 0
        opens:
          type: integer
          example: 0
        total:
          type: integer
          example: 0
        clicks:
          type: integer
          example: 0

    CampaignUser:
      type: object
      required:
        - id
        - campaign_id
        - user_id
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
        campaign_id:
          type: string
          format: uuid
          example: "52f3f921-1343-48af-b795-87c0fd3b44aa"
        user_id:
          type: string
          format: uuid
          example: "7c1e3c5a-2b4d-4e8f-9a1b-3c5d7e9f1a2b"
        status:
          type: string
          enum: [pending, throttled, sent, aborted, failed, opened]
          example: "sent"
        sent_at:
          type: string
          format: date-time
          example: "2025-11-23T17:30:00.000Z"
        created_at:
          type: string
          format: date-time
          example: "2025-11-23T17:20:00.000Z"
        updated_at:
          type: string
          format: date-time
          example: "2025-11-23T17:30:00.000Z"

    Provider:
      type: object
      required:
        - id
        - type
        - name
        - project_id
        - group
        - is_default
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          example: "5143f27c-cca9-4dc4-9059-e1dbb08144ad"
        type:
          type: string
          example: "webhook"
        name:
          type: string
          example: "Lunogram"
        project_id:
          type: string
          format: uuid
          example: "4c9d3163-7b64-4f9e-9068-d2e4b96be56b"
        group:
          type: string
          enum: [email, sms, push]
          example: "email"
        data:
          oneOf:
            - $ref: '#/components/schemas/EmailProviderData'
            - $ref: '#/components/schemas/SmsProviderData'
            - $ref: '#/components/schemas/PushProviderData'
          x-go-type: json.RawMessage
        is_default:
          type: boolean
          example: true
        rate_limit:
          type: integer
          example: 0
          x-go-type: int32
        rate_interval:
          type: string
          enum: [second, minute, hour, day]
          example: "second"
        created_at:
          type: string
          format: date-time
          example: "2025-11-05T13:38:03.861Z"
        updated_at:
          type: string
          format: date-time
          example: "2025-11-11T13:58:40.657Z"

    Template:
      type: object
      required:
        - id
        - project_id
        - campaign_id
        - data
        - type
        - locale
        - created_at
        - updated_at
      properties:
        created_at:
          type: string
          format: date-time
          example: "2025-11-19T14:18:43.020Z"
        updated_at:
          type: string
          format: date-time
          example: "2025-11-24T10:06:34.082Z"
        id:
          type: string
          format: uuid
          example: "4fe0d7e3-3071-40aa-a3ee-ecfb8e26a269"
        project_id:
          type: string
          format: uuid
          example: "4c9d3163-7b64-4f9e-9068-d2e4b96be56b"
        campaign_id:
          type: string
          format: uuid
          example: "52f3f921-1343-48af-b795-87c0fd3b44aa"
        type:
          type: string
          enum: [email, sms, push]
          example: "email"
        data:
          oneOf:
            - $ref: '#/components/schemas/EmailTemplateData'
            - $ref: '#/components/schemas/SmsTemplateData'
            - $ref: '#/components/schemas/PushTemplateData'
          x-go-type: json.RawMessage
        locale:
          type: string
          example: "en"

    EmailTemplateData:
      type: object
