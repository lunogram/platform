components:
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        x-go-type: PaginationLimit
      description: Maximum number of items to return
    
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
        x-go-type: PaginationOffset
      description: Number of items to skip
    
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
        x-go-type: PaginationSearch
      description: Search query string

  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    
    CampaignListResponse:
      description: Campaigns retrieved successfully
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PaginatedResponse'
              - type: object
                required:
                  - results
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Campaign'
    
    JourneyListResponse:
      description: Journeys retrieved successfully
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PaginatedResponse'
              - type: object
                required:
                  - results
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Journey'

    TagListResponse:
      description: Tags retrieved successfully
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PaginatedResponse'
              - type: object
                required:
                  - results
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tag'

  schemas:
    Problem:
      type: object
      required:
        - title
        - detail
      properties:
        title:
          type: string
          description: |
            A short summary of the problem type. Written in English and readable for engineers, usually not suited for non technical stakeholders and not localized.
          example: some title for the error situation
        detail:
          type: string
          description: |
            A human readable explanation specific to this occurrence of the problem that is helpful to locate the problem and give advice on how to proceed. Written in English and readable for engineers, usually not suited for non technical stakeholders and not localized.
          example: some description for the error situation

    PaginatedResponse:
      type: object
      required:
        - total
        - limit
        - offset
      properties:
        total:
          type: integer
          description: Total number of items matching the filters
          example: 42
        limit:
          type: integer
          description: Maximum number of items returned
          example: 20
        offset:
          type: integer
          description: Number of items skipped
          example: 0

    UserList:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          required:
            - results
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/User'

    AdminList:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          required:
            - results
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/Admin'

    ProjectList:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          required:
            - results
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/Project'

    Project:
      type: object
      required:
        - id
        - name
        - timezone
        - locale
        - role
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          example: "4c9d3163-7b64-4f9e-9068-d2e4b96be56b"
        organization_id:
          type: string
          format: uuid
          example: "7c1e3c5a-2b4d-4e8f-9a1b-3c5d7e9f1a2b"
        name:
          type: string
          example: "My Project"
        description:
          type: string
          example: "A project for managing customer communications"
        timezone:
          type: string
          example: "America/New_York"
        locale:
          type: string
          example: "en-US"
        role:
          type: string
          example: "admin"
        text_opt_out_message:
          type: string
          example: "Reply STOP to unsubscribe"
        text_help_message:
          type: string
          example: "Reply HELP for assistance"
        link_wrap_email:
          type: boolean
          example: false
        link_wrap_push:
          type: boolean
          example: false
        tools:
          type: array
          items:
            type: string
          example: ["analytics", "reporting"]
        has_provider:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: "2025-11-19T14:18:42.960Z"
        updated_at:
          type: string
          format: date-time
          example: "2025-11-23T17:20:00.021Z"

    CreateProject:
      type: object
      required:
        - name
        - timezone
        - locale
      properties:
        name:
          type: string
          example: "My New Project"
        description:
          type: string
          example: "A project for managing customer communications"
        timezone:
          type: string
          example: "America/New_York"
        locale:
          type: string
          example: "en-US"
        text_opt_out_message:
          type: string
          example: "Reply STOP to unsubscribe"
        text_help_message:
