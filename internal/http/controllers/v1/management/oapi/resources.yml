components:
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        x-go-type: PaginationLimit
      description: Maximum number of items to return

    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
        x-go-type: PaginationOffset
      description: Number of items to skip

    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
        x-go-type: PaginationSearch
      description: Search query string

  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"

    CampaignListResponse:
      description: Campaigns retrieved successfully
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/PaginatedResponse"
              - type: object
                required:
                  - results
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/Campaign"

    JourneyListResponse:
      description: Journeys retrieved successfully
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/PaginatedResponse"
              - type: object
                required:
                  - results
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/Journey"

    TagListResponse:
      description: Tags retrieved successfully
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/PaginatedResponse"
              - type: object
                required:
                  - results
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/Tag"

    SubscriptionListResponse:
      description: Subscriptions retrieved successfully
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/PaginatedResponse"
              - type: object
                required:
                  - results
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/Subscription"

    DocumentListResponse:
      description: Documents retrieved successfully
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/PaginatedResponse"
              - type: object
                required:
                  - results
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/Document"

    ListListResponse:
      description: Lists retrieved successfully
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/PaginatedResponse"
              - type: object
                required:
                  - results
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/List"

    EventListResponse:
      description: Events retrieved successfully
      content:
        application/json:
          schema:
            type: object
            required:
              - results
            properties:
              results:
                type: array
                items:
                  $ref: "#/components/schemas/EventWithSchema"

    ProviderListResponse:
      description: Providers retrieved successfully
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/PaginatedResponse"
              - type: object
                required:
                  - results
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/Provider"

    ApiKeyListResponse:
      description: API keys retrieved successfully
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/PaginatedResponse"
              - type: object
                required:
                  - results
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiKey"

  schemas:
    Channel:
      type: string
      enum: [email, text, push]
      description: Communication channel type
      example: email

    JourneyStepType:
      type: string
      enum:
        - entrance
        - exit
        - delay
        - action
        - gate
        - experiment
        - link
        - sticky
        - balancer
        - update
        - event
      description: Journey step type
      example: entrance

    EntranceStepData:
      type: object
      description: Data for entrance step - entry point into journey
      additionalProperties: false
      properties:
        trigger:
          type: string
          enum: [none, event, schedule]
          description: Trigger type for entrance
          example: "event"
        event_name:
          type: string
          description: Event name that triggers entrance
          example: "user_signup"
        rule:
          type: object
          description: Rule for filtering events
          additionalProperties: true
          x-go-type: rules.RuleSet
        multiple:
          type: boolean
          description: Allow multiple entries
          example: false
        concurrent:
          type: boolean
          description: Allow concurrent journey runs
          example: false
        list_id:
          type: string
          format: uuid
          description: List ID for scheduled entrance
        schedule:
          type: string
          description: RRule schedule string
          example: "FREQ=DAILY;BYHOUR=9;BYMINUTE=0"

    ExitStepData:
      type: object
      description: Data for exit step - exits user from journey
      required:
        - entrance_uuid
      properties:
        entrance_uuid:
          type: string
          description: External ID of entrance to exit from
          example: "step_abc123"

    DelayStepData:
      type: object
      description: Data for delay step - wait before proceeding
      required:
        - format
      properties:
        format:
          type: string
          enum: [duration, time, date]
          description: Format of delay
          example: "duration"
        minutes:
          type: integer
          description: Minutes to delay (for duration format)
          example: 30
        hours:
          type: integer
          description: Hours to delay (for duration format)
          example: 1
        days:
          type: integer
          description: Days to delay (for duration format)
          example: 0
        time:
          type: string
          description: Time of day HH:mm (for time format)
          example: "09:00"
        date:
          type: string
          description: Date template string (for date format)
          example: "2025-12-31T23:59:59Z"
        exclusion_days:
          type: array
          description: Days to exclude (0=Sunday, 6=Saturday)
          items:
            type: integer
            minimum: 0
            maximum: 6

    ActionStepData:
      type: object
      description: Data for action step - send campaign
      required:
        - campaign_id
      properties:
        campaign_id:
          type: string
          format: uuid
          description: Campaign to send
          example: "52f3f921-1343-48af-b795-87c0fd3b44aa"
          x-go-type: uuid.UUID

    GateStepData:
      type: object
      description: Data for gate step - conditional branching
      required:
        - rule
      properties:
        rule:
          type: object
          description: Rule set for conditional evaluation
          additionalProperties: true
          x-go-type: rules.RuleSet

    ExperimentStepData:
      type: object
      description: Data for experiment step - A/B testing
      properties:
        name:
          type: string
          description: Experiment name
          example: "Welcome Email Test"

    LinkStepData:
      type: object
      description: Data for link step - add user to another journey
      required:
        - target_id
      properties:
        target_id:
          type: string
          format: uuid
          description: Target journey ID to link to
        delay:
          type: string
          enum: ["1 minute", "15 minutes", "1 hour", "1 day"]
          description: Delay before adding to journey
          example: "1 day"

    StickyStepData:
      type: object
      description: Data for sticky step - placeholder for sticky logic
      properties: {}

    BalancerStepData:
