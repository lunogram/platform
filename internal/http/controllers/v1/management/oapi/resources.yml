openapi: 3.0.3
info:
  title: Lunogram Management API
  description: API for managing campaigns, templates, and providers
  version: 1.0.0

paths:
  /api/auth/methods:
    get:
      summary: Get available auth methods
      description: Returns a list of available authentication methods/drivers
      operationId: getAuthMethods
      tags:
        - Auth
      responses:
        "200":
          description: Auth methods retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  description: Authentication driver identifier
                example: ["basic", "clerk"]
        default:
          $ref: "#/components/responses/Error"

  /api/auth/login/{driver}/callback:
    post:
      summary: Complete authentication
      description: Validates credentials and completes the authentication flow
      operationId: authCallback
      tags:
        - Auth
      parameters:
        - name: driver
          in: path
          required: true
          schema:
            type: string
            enum: [basic, clerk]
          description: The authentication driver
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCallbackRequest"
      responses:
        "200":
          description: Authentication successful
        default:
          $ref: "#/components/responses/Error"

  /api/auth/{driver}/webhook:
    post:
      summary: Auth provider webhook
      description: Webhook endpoint for external auth providers (e.g., Clerk user sync)
      operationId: authWebhook
      tags:
        - Auth
      parameters:
        - name: driver
          in: path
          required: true
          schema:
            type: string
            enum: [clerk]
          description: The authentication driver
      responses:
        "200":
          description: Webhook processed successfully
        default:
          $ref: "#/components/responses/Error"

  /api/admin/projects/{projectID}/campaigns:
    get:
      summary: List campaigns
      description: Retrieves a list of campaigns with optional filtering
      operationId: listCampaigns
      tags:
        - Campaigns
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          $ref: "#/components/responses/CampaignListResponse"
        default:
          $ref: "#/components/responses/Error"

    post:
      summary: Create campaign
      description: Creates a new campaign
      operationId: createCampaign
      tags:
        - Campaigns
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCampaign"
      responses:
        "201":
          description: Campaign created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        default:
          $ref: "#/components/responses/Error"

  /api/admin/projects/{projectID}/campaigns/{campaignID}:
    get:
      summary: Get campaign by ID
      description: Retrieves a specific campaign with its templates and provider information
      operationId: getCampaign
      tags:
        - Campaigns
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: campaignID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The campaign ID
      responses:
        "200":
          description: Campaign retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/Campaign"
        default:
          $ref: "#/components/responses/Error"

    patch:
      summary: Update campaign
      description: Updates campaign properties such as name and provider
      operationId: updateCampaign
      tags:
        - Campaigns
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: campaignID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The campaign ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCampaign"
      responses:
        "200":
          description: Campaign updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        default:
          $ref: "#/components/responses/Error"

    delete:
      summary: Delete campaign
      description: Archives a campaign by setting its deleted_at timestamp
      operationId: deleteCampaign
      tags:
        - Campaigns
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: campaignID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The campaign ID
      responses:
        "204":
          description: Campaign deleted successfully
        default:
          $ref: "#/components/responses/Error"

  /api/admin/projects/{projectID}/campaigns/{campaignID}/templates:
    post:
      summary: Create template
      description: Creates a new template for a campaign
      operationId: createTemplate
      tags:
        - Templates
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: campaignID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The campaign ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTemplate"
      responses:
        "201":
          description: Template created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        default:
          $ref: "#/components/responses/Error"

  /api/admin/projects/{projectID}/campaigns/{campaignID}/templates/{templateID}:
    get:
      summary: Get template by ID
      description: Retrieves a specific template with its content and editor data
      operationId: getTemplate
      tags:
        - Templates
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: campaignID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The campaign ID
        - name: templateID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The template ID
      responses:
        "200":
          description: Template retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/Template"
        default:
          $ref: "#/components/responses/Error"

    patch:
      summary: Update template
      description: Updates template properties and content
      operationId: updateTemplate
      tags:
        - Templates
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: campaignID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The campaign ID
        - name: templateID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The template ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTemplate"
      responses:
        "200":
          description: Template updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        default:
          $ref: "#/components/responses/Error"

    delete:
      summary: Delete template
      description: Deletes a template
      operationId: deleteTemplate
      tags:
        - Templates
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: campaignID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The campaign ID
        - name: templateID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The template ID
      responses:
        "204":
          description: Template deleted successfully
        default:
          $ref: "#/components/responses/Error"

  /api/admin/projects/{projectID}/campaigns/{campaignID}/duplicate:
    post:
      summary: Duplicate campaign
      description: Creates a copy of the campaign with all its templates
      operationId: duplicateCampaign
      tags:
        - Campaigns
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: campaignID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The campaign ID to duplicate
      responses:
        "201":
          description: Campaign duplicated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        default:
          $ref: "#/components/responses/Error"

  /api/admin/projects/{projectID}/campaigns/{campaignID}/users:
    get:
      summary: Get campaign users
      description: Retrieves the list of users associated with a campaign
      operationId: getCampaignUsers
      tags:
        - Campaigns
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: campaignID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The campaign ID
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Campaign users retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - total
                  - limit
                  - offset
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CampaignUser"
                  total:
                    type: integer
                    minimum: 0
                  limit:
                    type: integer
                  offset:
                    type: integer
        default:
          $ref: "#/components/responses/Error"

  /api/admin/projects/{projectID}/lists:
    get:
      summary: List lists
      description: Retrieves a paginated list of lists for a project
      operationId: listLists
      tags:
        - Lists
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          $ref: "#/components/responses/ListListResponse"
        default:
          $ref: "#/components/responses/Error"

    post:
      summary: Create list
      description: Creates a new list
      operationId: createList
      tags:
        - Lists
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateList"
      responses:
        "201":
          description: List created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List"
        default:
          $ref: "#/components/responses/Error"

  /api/admin/projects/{projectID}/lists/{listID}:
    get:
      summary: Get list by ID
      description: Retrieves a specific list
      operationId: getList
      tags:
        - Lists
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: listID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The list ID
      responses:
        "200":
          description: List retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List"
        default:
          $ref: "#/components/responses/Error"

    patch:
      summary: Update list
      description: Updates list properties such as name, rule, and tags
      operationId: updateList
      tags:
        - Lists
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: listID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The list ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateList"
      responses:
        "200":
          description: List updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List"
        default:
          $ref: "#/components/responses/Error"

    delete:
      summary: Delete list
      description: Soft deletes a list
      operationId: deleteList
      tags:
        - Lists
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: listID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The list ID
      responses:
        "204":
          description: List deleted successfully
        default:
          $ref: "#/components/responses/Error"

  /api/admin/projects/{projectID}/lists/{listID}/duplicate:
    post:
      summary: Duplicate list
      description: Creates a copy of the list
      operationId: duplicateList
      tags:
        - Lists
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: listID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The list ID to duplicate
      responses:
        "201":
          description: List duplicated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List"
        default:
          $ref: "#/components/responses/Error"

  /api/admin/projects/{projectID}/lists/{listID}/users:
    get:
      summary: Get list users
      description: Retrieves the list of users associated with a list
      operationId: getListUsers
      tags:
        - Lists
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: listID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The list ID
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: List users retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        default:
          $ref: "#/components/responses/Error"

    post:
      summary: Import list users
      description: Imports users to a static list from a CSV file
      operationId: importListUsers
      tags:
        - Lists
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: listID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The list ID
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV file containing user data. Must include external_id column.
      responses:
        "204":
          description: Users imported successfully
        default:
          $ref: "#/components/responses/Error"

  /api/admin/projects:
    get:
      summary: List projects
      description: Retrieves a paginated list of projects accessible to the authenticated admin
      operationId: listProjects
      tags:
        - Projects
      security:
        - HttpBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Projects retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        default:
          $ref: "#/components/responses/Error"

    post:
      summary: Create project
      description: Creates a new project
      operationId: createProject
      tags:
        - Projects
      security:
        - HttpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProject"
      responses:
        "201":
          description: Project created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"

  /api/admin/projects/{projectID}:
    get:
      summary: Get project by ID
      description: Retrieves a specific project
      operationId: getProject
      tags:
        - Projects
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
      responses:
        "200":
          description: Project retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"

    patch:
      summary: Update project
      description: Updates project properties
      operationId: updateProject
      tags:
        - Projects
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProject"
      responses:
        "200":
          description: Project updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"

  /api/admin/projects/{projectID}/journeys:
    get:
      summary: List journeys
      description: Retrieves a paginated list of journeys for a project
      operationId: listJourneys
      tags:
        - Journeys
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          $ref: "#/components/responses/JourneyListResponse"
        default:
          $ref: "#/components/responses/Error"

    post:
      summary: Create journey
      description: Creates a new journey
      operationId: createJourney
      tags:
        - Journeys
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJourney"
      responses:
        "201":
          description: Journey created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Journey"
        default:
          $ref: "#/components/responses/Error"

  /api/admin/projects/{projectID}/journeys/{journeyID}:
    get:
      summary: Get journey by ID
      description: Retrieves a specific journey
      operationId: getJourney
      tags:
        - Journeys
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: journeyID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The journey ID
      responses:
        "200":
          description: Journey retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Journey"
        default:
          $ref: "#/components/responses/Error"

    patch:
      summary: Update journey
      description: Updates journey properties such as name, description, and status
      operationId: updateJourney
      tags:
        - Journeys
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: journeyID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The journey ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateJourney"
      responses:
        "200":
          description: Journey updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Journey"
        default:
          $ref: "#/components/responses/Error"

    delete:
      summary: Delete journey
      description: Soft deletes a journey
      operationId: deleteJourney
      tags:
        - Journeys
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: journeyID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The journey ID
      responses:
        "204":
          description: Journey deleted successfully
        default:
          $ref: "#/components/responses/Error"

  /api/admin/projects/{projectID}/journeys/{journeyID}/steps:
    get:
      summary: Get journey steps
      description: Retrieves the step map (workflow definition) for a journey
      operationId: getJourneySteps
      tags:
        - Journeys
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: journeyID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The journey ID
      responses:
        "200":
          description: Journey steps retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyStepMap"
        default:
          $ref: "#/components/responses/Error"

    put:
      summary: Set journey steps
      description: Sets or updates the step map (workflow definition) for a journey
      operationId: setJourneySteps
      tags:
        - Journeys
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: journeyID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The journey ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JourneyStepMap"
      responses:
        "200":
          description: Journey steps updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyStepMap"
        default:
          $ref: "#/components/responses/Error"

  /api/admin/projects/{projectID}/journeys/{journeyID}/version:
    post:
      summary: Create journey version
      description: Creates a new version of a journey as a child, keeping the same step UUIDs
      operationId: versionJourney
      tags:
        - Journeys
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: journeyID
