      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: broadcastID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The broadcast ID
      responses:
        "200":
          description: Server-Sent Event stream of broadcast progress updates
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Server-Sent Events stream. Events include "connected" on connection
                  and "progress" events whose data field is a JSON-encoded BroadcastProgressEvent.
        default:
          $ref: "#/components/responses/Error"

