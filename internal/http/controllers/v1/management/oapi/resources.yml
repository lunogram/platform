  /api/admin/projects/{projectID}/journeys/{journeyID}/users/{userID}:
    get:
      summary: Stream user journey steps
      description: Streams the current steps and progress of a specific user in a journey in real-time using Server-Sent Events (SSE)
      operationId: streamUserJourneySteps
      tags:
        - Journeys
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: journeyID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The journey ID
        - name: userID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The user ID to check journey status for
      responses:
        "200":
          description: Server-Sent Event stream of user journey step updates
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events stream. Events include "connected" on connection and "step" events with journey step data.
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Trigger a user into a journey
      description: Triggers a user into a journey at a specific entrance step, typically used for testing or manual overrides
      operationId: triggerUser
      tags:
        - Journeys
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: journeyID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The journey ID
        - name: userID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The user ID to enroll in the journey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - externalStepID
              properties:
                externalStepID:
                  type: string
                  format: uuid
                  description: The ID of the journey entry to enroll the user in
                data:
                  type: object
                  additionalProperties: true
                  description: Optional event data to store on the entrance step state, made available as journey variables
      responses:
        "200":
          description: User enrolled in journey successfully
        default:
          $ref: "#/components/responses/Error"
    put:
      summary: Advance user step
      description: Advances the current step for a user in a journey and moves to the next step
      operationId: AdvanceUserStep
      tags:
        - Journeys
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: journeyID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The journey ID
        - name: userID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The user ID whose current step should be advanced
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - externalStepID
              properties:
                externalStepID:
                  type: string
                  format: uuid
                  description: The external ID of the current step to advance
      responses:
        "200":
          description: Current step advanced successfully
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: Cancel user journey
