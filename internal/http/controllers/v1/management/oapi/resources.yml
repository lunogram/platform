  /api/admin/projects/{projectID}/broadcasts/{broadcastID}/users:
    get:
      summary: Get broadcast users
      description: Retrieves the users that were sent to as part of a broadcast
      operationId: getBroadcastUsers
      tags:
        - Broadcasts
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: broadcastID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The broadcast ID
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Broadcast users retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - results
                  - total
                  - limit
                  - offset
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        user_id:
                          type: string
                          format: uuid
                        state:
                          type: string
                        sent_at:
                          type: string
                          format: date-time
                        failure_reason:
                          type: string
                          nullable: true
                          description: >-
                            Why the recipient was not reached, set only when state is failed.
                            Distinguishes a suppressed recipient (recipient_opted_out) from a
                            genuine delivery failure such as invalid_recipient. Left
                            unconstrained for the same reason as InboxMessage.failure_reason.
                        full_name:
                          type: string
                        email:
                          type: string
                        phone:
                          type: string
                  total:
                    type: integer
                    minimum: 0
                  limit:
                    type: integer
                  offset:
                    type: integer
        default:
          $ref: "#/components/responses/Error"

