  /api/admin/projects/{projectID}/subjects/users/{userID}/inbox:
    get:
      summary: Get user inbox messages
      description: Retrieves inbox messages for a specific user
      operationId: getUserInboxMessages
      tags:
        - Users
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: userID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The user ID
        - name: status
          in: query
          description: >-
            Filters by read state, or by delivery outcome when set to failed. Selecting failed
            returns messages that were terminally settled without being delivered, such as a
            recipient suppressed by an opt-out, regardless of their read state.
          schema:
            type: string
            enum: [unread, read, archived, failed]
        - name: tags
          in: query
          schema:
            type: string
          description: Comma-separated tag filter. All listed tags must be present.
        - name: message_source
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: integer
        - name: channel
          in: query
          schema:
            $ref: "#/components/schemas/Channel"
        - name: include_archived
          in: query
          schema:
            type: boolean
            default: false
        - name: include_scheduled
          in: query
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: User inbox messages retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxMessageList"
        default:
          $ref: "#/components/responses/Error"
    post:
