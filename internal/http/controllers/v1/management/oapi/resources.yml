    SubjectScope:
      type: string
      enum: [all, own]
      description: >-
        Data boundary for an auth method. "all" acts across every subject's
        records; "own" confines a verified end user to their own records. Only
        meaningful for verified-subject types (trusted_issuer, session); api_key
        is always "all".
      example: own

    AuthMethodType:
      type: string
      enum: [api_key, trusted_issuer, session]
      description: |
        How an auth method authenticates a client. `api_key` is a
        Lunogram-issued key; `trusted_issuer` validates external JWTs against a
        configured JWKS/PEM; `session` mints short-lived user-scoped tokens.
      example: api_key

    PermissionGrant:
      type: object
      description: A single (resource, verb) entry in a custom permission set.
      required:
        - resource
        - verb
      properties:
        resource:
          type: string
          example: inbox
        verb:
          type: string
          enum: [read, create, update, delete]
          example: read
        instances:
          type: array
          nullable: true
          items:
            type: string
          description: >-
            Optional allow-list of named instances this grant is scoped to. For
            a create grant the method may only create instances with these names
            (e.g. event names); omitted/empty = unrestricted. Only meaningful
            for create today.
          example: [purchase, signup]

    ClaimMapping:
      type: object
      description: >-
        Maps identity fields to the JWT claims that carry them. Each field names
        the claim to read; values follow the JWT spec (e.g. `sub`).
      properties:
        sub:
          type: string
          description: JWT claim carrying the external user id (defaults to "sub").
          example: sub

    TrustedIssuer:
      type: object
      description: External-JWT validation config for a trusted_issuer method. Exactly one of jwks_url or public_cert is set.
      properties:
        jwks_url:
          type: string
          example: "https://acme.example/.well-known/jwks.json"
        public_cert:
          type: string
          description: PEM-encoded public certificate (alternative to jwks_url).
        iss:
          type: string
          example: "https://acme.example"
        aud:
          type: string
          example: "lunogram"
        claim:
          $ref: "#/components/schemas/ClaimMapping"

    SessionConfig:
      type: object
      description: Config for a session method.
      properties:
        ttl_seconds:
          type: integer
          description: Lifetime of minted session tokens, in seconds.
          example: 900

    AuthMethod:
      type: object
      required:
        - id
        - project_id
        - type
        - name
        - role
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/AuthMethodType"
        name:
          type: string
          example: "Production key"
        description:
          type: string
        role:
          $ref: "#/components/schemas/ProjectRole"
        subject_scope:
          $ref: "#/components/schemas/SubjectScope"
        grants:
          type: array
          items:
            $ref: "#/components/schemas/PermissionGrant"
        trusted_issuer:
          $ref: "#/components/schemas/TrustedIssuer"
        session:
          $ref: "#/components/schemas/SessionConfig"
        secret:
          type: string
          description: |
            The full secret value. Returned only once, in the response to
            creating an api_key method, and never again.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateAuthMethod:
      type: object
      required:
        - type
        - name
      properties:
        type:
          $ref: "#/components/schemas/AuthMethodType"
        name:
          type: string
        description:
          type: string
        role:
          $ref: "#/components/schemas/ProjectRole"
        subject_scope:
          $ref: "#/components/schemas/SubjectScope"
        grants:
