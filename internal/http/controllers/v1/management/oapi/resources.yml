          description: The user this send was for. Only present on non-terminal per-send events.
        state:
          type: string
          description: "Current state: sent (per-user), completed, failed, or cancelled (terminal)"
          example: sent
        total_sent:
          type: integer
          description: Running count of successfully sent messages
          example: 42
        terminal:
          type: boolean
          description: True when the broadcast has reached a final state and no more events will follow
          example: false
        full_name:
          type: string
          description: Full name of the recipient user (non-terminal events only)
        email:
          type: string
          description: Email of the recipient user (non-terminal events only)
        phone:
          type: string
          description: Phone number of the recipient user (non-terminal events only)

    CreateBroadcast:
      type: object
      required:
        - campaign_id
        - list_id
      properties:
        campaign_id:
          type: string
          format: uuid
          description: The campaign to broadcast
        list_id:
          type: string
          format: uuid
          description: The list of users to send the broadcast to
        scheduled_at:
          type: string
          format: date-time
          description: Optional scheduled send time. If provided, the broadcast is created in 'scheduled' state.
        variant:
          type: string
          nullable: true
          description: >-
            Pins every message in this broadcast to one template variant. Leave
            unset to let the campaign's variant selector resolve a variant per
            recipient, which is what a mixed-tenant list needs.
          example: "acme"

    UpdateBroadcast:
      type: object
      properties:
        scheduled_at:
          type: string
          format: date-time
          nullable: true
          description: Set or update the scheduled send time. Pass null to remove the schedule and revert to pending. Only allowed when the broadcast is in 'pending' or 'scheduled' state.

    Broadcast:
      type: object
      required:
        - id
        - project_id
        - campaign_id
        - list_id
        - list_name
        - list_type
        - state
        - total
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        campaign_id:
          type: string
          format: uuid
        list_id:
          type: string
          format: uuid
        list_name:
          type: string
          description: Snapshot of the list name at broadcast creation time
        list_type:
          type: string
          description: Snapshot of the list type at broadcast creation time
        variant:
          type: string
          nullable: true
          description: Template variant every message in this broadcast is pinned to
        state:
          $ref: "#/components/schemas/BroadcastState"
        total:
          type: integer
          description: Total number of users in the audience at send time
          example: 0
        sent:
          type: integer
          description: Number of messages actually delivered so far
          example: 0
        failed:
          type: integer
          description: Number of messages that terminally will not be delivered, such as a suppressed recipient or a permanent provider rejection
          example: 0
        error:
          type: string
          description: Error message if the broadcast failed
        scheduled_at:
          type: string
          format: date-time
          description: When the broadcast is scheduled to be sent
        started_at:
          type: string
          format: date-time
          description: When the broadcast started sending
        completed_at:
          type: string
          format: date-time
          description: When the broadcast completed or failed
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        campaign:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            channel:
              type: string
    
    AdminOrganization:
      type: object
      required:
        - id
        - name
        - role
        - is_active
      properties:
        id:
          type: string
          format: uuid
          example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
        name:
          type: string
          example: "Acme Inc"
        role:
          type: string
          description: The admin's role within this organization
          example: owner
        is_active:
          type: boolean
          description: Whether this is the admin's currently active organization
          example: true

    SessionRefresh:
      type: object
      required:
        - expires_at
      properties:
        expires_at:
          type: string
          format: date-time
          description: When the refreshed session expires if it is not used again
          example: "2025-11-19T14:18:42.960Z"

    SetActiveOrganization:
      type: object
      required:
        - organization_id
      properties:
        organization_id:
          type: string
          format: uuid
          example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"

    CreateProjectInvite:
      type: object
      required:
        - email
        - role
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        role:
          type: string
          enum: [support, client, editor, admin]
          example: admin
        expires_in:
          type: string
          description: Duration until the invite expires (e.g. "24h", "7d"). Optional, defaults to 24 hours.
          example: "24h"

    ProjectInvite:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
        project_id:
          type: string
          format: uuid
          example: "4c9d3163-7b64-4f9e-9068-d2e4b96be56b"
        project_name:
          type: string
          example: "My Project"
          description: Name of the project the invite grants access to
        inviter_admin_id:
          type: string
          format: uuid
          nullable: true
          example: "5143f27c-cca9-4dc4-9059-e1dbb08144ad"
        inviter_admin_email:
          type: string
          example: "admin@example.com"
          nullable: true
        invitee_email:
          type: string
          format: email
          example: "user@example.com"
        invitee_admin_id:
          type: string
          format: uuid
          nullable: true
          description: Id of the existing admin that owns the invitee email, if any
          example: "7d2c1b0a-0000-4000-8000-000000000000"
        role:
          type: string
          enum: [support, client, editor, admin]
          example: admin
        expires_at:
          type: string
          format: date-time
          example: "2025-12-31T23:59:59Z"
        accepted_at:
          type: string
          format: date-time
          nullable: true
          example: null
        revoked_at:
          type: string
          format: date-time
          nullable: true
          example: null
        created_at:
          type: string
          format: date-time
          example: "2025-12-31T23:59:59Z"

    OIDCProvider:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: Names the provider in its login URLs
        name:
          type: string
          description: What the login page calls it

  securitySchemes:
    HttpBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for API authentication
