            format: uuid
          description: The project ID
        - name: journeyID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The journey ID
        - name: userID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The user ID whose journey execution should be cancelled
      responses:
