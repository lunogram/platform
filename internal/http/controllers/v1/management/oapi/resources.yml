  schemas:
    Channel:
      type: string
      enum: [email, sms, push, inbox]
      description: Communication channel type
      example: email

    ActionType:
      type: string
      description: Type of action (module ID from registered action modules)
      example: webhook

    Action:
      type: object
      required:
        - id
        - project_id
        - name
        - type
        - config
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
        project_id:
          type: string
          format: uuid
          example: "4c9d3163-7b64-4f9e-9068-d2e4b96be56b"
        name:
          type: string
          example: "My Webhook Action"
        type:
          $ref: "#/components/schemas/ActionType"
        config:
          type: object
          additionalProperties: true
          x-go-type: json.RawMessage
          description: Action configuration (varies by type)
        created_at:
          type: string
          format: date-time
          example: "2025-11-19T14:18:42.960Z"
        updated_at:
          type: string
          format: date-time
          example: "2025-11-23T17:20:00.021Z"

    CreateAction:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          example: "My Webhook Action"
        type:
          $ref: "#/components/schemas/ActionType"
        config:
          type: object
          additionalProperties: true
          x-go-type: json.RawMessage
          description: Action configuration (varies by type)

    UpdateAction:
      type: object
      properties:
        name:
          type: string
          example: "Updated Action Name"
        type:
          $ref: "#/components/schemas/ActionType"
        config:
          type: object
          additionalProperties: true
          x-go-type: json.RawMessage
          description: Action configuration (varies by type)

    ActionMeta:
      type: object
      required:
        - type
        - name
        - functions
      properties:
        type:
          type: string
          description: Module ID
          example: "webhook"
        name:
          type: string
          description: Human-readable module name
          example: "Webhook"
        description:
          type: string
          description: Module description
          example: "Send HTTP webhooks to external services"
        config_schema:
          type: object
          additionalProperties: true
          x-go-type: json.RawMessage
          description: JSON Schema for module-level configuration (API keys, etc.)
        functions:
          type: array
          items:
            $ref: "#/components/schemas/ActionFunction"
          description: Available functions in this action module
        icon:
          type: string
          description: Icon URL for the module
        color:
          type: string
          description: Brand color hex code for the module
        hidden:
          type: boolean
          description: Whether this module is hidden from the UI

    ActionFunction:
      type: object
      required:
        - id
        - title
      properties:
        id:
          type: string
          description: Function identifier
          example: "send_request"
        title:
          type: string
          description: Human-readable function name
          example: "Send Request"
        description:
          type: string
          description: Function description
          example: "Send an HTTP request to an external endpoint"
        input_schema:
          type: object
          additionalProperties: true
          x-go-type: json.RawMessage
          description: JSON Schema for function input

    TestActionRequest:
      type: object
      required:
        - type
      properties:
        type:
          $ref: "#/components/schemas/ActionType"
        config:
          type: object
          additionalProperties: true
          x-go-type: json.RawMessage
          description: Action configuration to validate (API keys, OAuth tokens, etc.)

    TestActionResult:
      type: object
      required:
        - status_code
      properties:
        status_code:
          type: integer
          description: Status code returned by the validation (e.g. 200 for success, 400/401/500 for errors)
          example: 200
        message:
          type: string
          description: Human-readable validation message
          example: "Configuration is valid"

    TestActionFunctionRequest:
      type: object
      properties:
        input:
          type: object
          additionalProperties: true
          description: Input parameters for the function execution

    TestActionFunctionResult:
      type: object
      required:
        - status_code
      properties:
        status_code:
          type: integer
          description: Status code returned by the function execution (e.g. 200 for success, 400/500 for errors)
          example: 200
        metadata:
          type: object
          additionalProperties: true
          description: Metadata returned by the function execution
          example: { "response_body": "OK" }

    JourneyStepType:
      type: string
      enum:
        - entrance
        - exit
        - delay
        - action
        - campaign
        - gate
        - experiment
        - sticky
        - balancer
        - update
        - event
        - schedule
      description: Journey step type
      example: entrance

    EntranceStepData:
      type: object
      description: >
        Data for entrance step - entry point into journey. Tagged union:
        `trigger` selects the kind and the matching sub-object (event, scheduled
        or list) carries its fields. `concurrent` and `multiple` apply to every
        kind. `none` is an API/manually triggered entrance with no sub-object.
      additionalProperties: false
      required:
        - trigger
      properties:
        trigger:
          type: string
          enum: [none, event, scheduled, list]
          description: Selects which trigger sub-object is active
          example: "event"
        concurrent:
          type: boolean
          description: Allow concurrent journey runs
          example: false
        multiple:
          type: boolean
          description: Allow re-entry after a previous run completed
          example: false
        event:
          $ref: "#/components/schemas/EntranceEventTrigger"
        scheduled:
          $ref: "#/components/schemas/EntranceScheduledTrigger"
        list:
          $ref: "#/components/schemas/EntranceListTrigger"

    EntranceEventTrigger:
      type: object
      description: Enters the user when a matching custom event is received
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          description: Event name that triggers entrance
          example: "user_signup"
        rule:
          type: object
          description: Optional condition evaluated against the event data
          additionalProperties: true
        user_rule:
          type: object
          description: Optional filter for organization members
          additionalProperties: true

    EntranceScheduledTrigger:
      type: object
      description: Enters the user when a schedule offset fires
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          description: Scheduled event name that triggers entrance
          example: "scheduled.weekly_digest"
        offset_id:
          type: string
          format: uuid
          description: Schedule offset that fires the entrance
        rule:
          type: object
          description: Optional condition evaluated against the event data
          additionalProperties: true
        user_rule:
          type: object
          description: Optional filter for organization members
          additionalProperties: true

    EntranceListTrigger:
      type: object
      description: Enters the user when they join or leave the referenced list
      additionalProperties: false
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
          description: List whose membership changes trigger entrance
        direction:
          type: string
          enum: [joins, leaves]
          description: Membership change that fires the trigger (default joins)
          example: "joins"
        exit_on_leave:
          type: boolean
          description: Exit the user when they leave the list (joins direction only)
          example: false

    ExitStepData:
      type: object
      description: Data for exit step - exits user from journey
      required:
        - entrance_uuid
      properties:
        entrance_uuid:
          type: string
          description: External ID of entrance to exit from
          example: "step_abc123"

    DelayStepData:
      type: object
      description: Data for delay step - wait before proceeding
      required:
        - format
      properties:
        format:
          type: string
          enum: [duration, time, date]
          description: Format of delay
          example: "duration"
        minutes:
          type: integer
          description: Minutes to delay (for duration format)
          example: 30
        hours:
          type: integer
          description: Hours to delay (for duration format)
          example: 1
        days:
          type: integer
          description: Days to delay (for duration format)
          example: 0
        time:
          type: string
          description: Time of day HH:mm (for time format)
          example: "09:00"
        date:
          type: string
          description: Date template string (for date format)
          example: "2025-12-31T23:59:59Z"
        exclusion_days:
          type: array
          description: Days to exclude (0=Sunday, 6=Saturday)
          items:
            type: integer
            minimum: 0
            maximum: 6

    CampaignStepData:
      type: object
      description: Data for campaign step - send campaign
      required:
        - campaign_id
      properties:
        campaign_id:
          type: string
          format: uuid
          description: Campaign to send
          example: "52f3f921-1343-48af-b795-87c0fd3b44aa"
          x-go-type: uuid.UUID
        variant:
          type: string
          description: >-
            Template variant to send, as a static key or a Liquid expression
            resolved against the journey context. Overrides the campaign's own
            variant selector.
          example: "{{ user.data.tenant }}"

    ActionStepData:
      type: object
      description: Data for action step - execute WASM action
      required:
        - action_id
      properties:
        action_id:
          type: string
          format: uuid
          description: Action to execute
          example: "52f3f921-1343-48af-b795-87c0fd3b44aa"
          x-go-type: uuid.UUID

    GateStepData:
      type: object
      description: Data for gate step - conditional branching
      required:
        - rule
      properties:
        rule:
          type: object
          description: Rule set for conditional evaluation
          additionalProperties: true

    ExperimentStepData:
      type: object
      description: Data for experiment step - A/B testing
      properties:
        name:
          type: string
          description: Experiment name
          example: "Welcome Email Test"

    StickyStepData:
      type: object
      description: Data for sticky step - placeholder for sticky logic
      properties: {}

    BalancerStepData:
      type: object
      description: Data for balancer step - rate-limited distribution
      required:
        - rate_limit
        - interval
      properties:
        rate_limit:
          type: integer
          description: Maximum users per interval
          example: 100
        interval:
          type: string
          enum: [second, minute, hour, day]
          description: Rate limit interval
          example: "hour"

    UpdateStepData:
      type: object
      description: Data for update step - update user data
      required:
        - template
      properties:
        template:
          type: string
          description: JSON template string for updating user data
          example: '{"last_journey": "onboarding"}'

    EventStepData:
      type: object
      description: Data for event step - trigger custom event
      required:
        - event_name
      properties:
        event_name:
          type: string
          description: Name of event to trigger
          example: "journey_milestone"
        template:
          type: string
          description: JSON template string for event data
          example: '{"milestone": "completed_step_1"}'

    ScheduleStepData:
      type: object
      description: Data for schedule step - assign user to a schedule
      required:
        - schedule_name
      properties:
        schedule_name:
          type: string
          description: Name of the schedule to assign the user to
          example: "onboarding_reminders"
        scheduled_at:
          type: string
          description: Optional RFC3339 date-time for when the schedule should fire. Supports Liquid templates.
          example: "2024-01-15T09:00:00Z"
        interval:
          type: string
          description: Optional PostgreSQL interval string (e.g. '1 day', '2 hours'). Supports Liquid templates.
          example: "1 day"
        start_at:
          type: string
          description: Optional RFC3339 date-time for when the schedule interval should start. Supports Liquid templates.
          example: "2024-01-15T09:00:00Z"
        template:
          type: string
          description: JSON template string for schedule data
          example: '{"source": "journey"}'

    ExperimentChildData:
      type: object
      description: Data for experiment step children - defines branch ratio
      additionalProperties: false
      required:
        - ratio
      properties:
        ratio:
          type: number
          format: float
          description: Ratio for this experiment branch (0-1)
          example: 0.5
          minimum: 0
          maximum: 1

    GateChildData:
      type: object
      description: Data for gate step children - typically empty, path determines branch
      properties: {}
      additionalProperties: false

    OrganizationRole:
      type: string
      enum: [owner, admin, member]
      description: Role within an organization
      example: member

    ProjectRole:
      type: string
      enum: [support, client, editor, admin]
      description: Role within a project
      example: admin

    SubscriptionState:
      type: string
      enum: [subscribed, unsubscribed]
      description: User subscription state
      example: subscribed

    Problem:
      type: object
      required:
        - title
        - detail
      properties:
        title:
          type: string
          description: |
            A short summary of the problem type. Written in English and readable for engineers, usually not suited for non technical stakeholders and not localized.
          example: some title for the error situation
        detail:
          type: string
          description: |
            A human readable explanation specific to this occurrence of the problem that is helpful to locate the problem and give advice on how to proceed. Written in English and readable for engineers, usually not suited for non technical stakeholders and not localized.
          example: some description for the error situation

    PaginatedResponse:
      type: object
      required:
        - total
        - limit
        - offset
      properties:
        total:
          type: integer
          description: Total number of items matching the filters
          example: 42
        limit:
          type: integer
          description: Maximum number of items returned
          example: 20
        offset:
          type: integer
          description: Number of items skipped
          example: 0

    ExternalID:
      type: object
      description: An external identifier with source and optional metadata
      required:
        - external_id
      properties:
        source:
          type: string
          default: "default"
          example: "default"
          description: Source of the identifier (e.g. "default", "anonymous", or a custom source). Defaults to "default" if not provided.
        external_id:
          type: string
          example: "user_12345"
          description: The external identifier value
        metadata:
          type: object
          additionalProperties: true
          nullable: true
          x-go-type: map[string]any
          description: Optional metadata associated with this identifier

    ExternalIDResponse:
      type: object
      description: An external identifier as returned in responses, including database ID and timestamps
      required:
        - id
        - source
        - external_id
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        source:
          type: string
          example: "default"
        external_id:
          type: string
          example: "user_12345"
        metadata:
          type: object
          additionalProperties: true
          nullable: true
          x-go-type: map[string]any
        created_at:
          type: string
          format: date-time
          example: "2025-11-19T14:18:42.960Z"
        updated_at:
          type: string
          format: date-time
          example: "2025-11-23T17:20:00.021Z"

    UserList:
