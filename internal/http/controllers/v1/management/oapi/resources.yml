openapi: 3.0.3
info:
  title: Lunogram Management API
  description: API for managing campaigns, templates, and providers
  version: 1.0.0

paths:
  /api/auth/methods:
    get:
      summary: Get available auth methods
      description: Returns a list of available authentication methods/drivers
      operationId: getAuthMethods
      tags:
        - Auth
      responses:
        "200":
          description: Auth methods retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  description: Authentication driver identifier
                example: ["password", "clerk"]
        default:
          $ref: "#/components/responses/Error"

  /api/auth/login/{driver}/callback:
    post:
      summary: Complete authentication
      description: Validates credentials and completes the authentication flow
      operationId: authCallback
      tags:
        - Auth
      parameters:
        - name: driver
          in: path
          required: true
          schema:
            type: string
            enum: [basic, clerk]
          description: The authentication driver
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCallbackRequest"
      responses:
        "200":
          description: Authentication successful
        default:
          $ref: "#/components/responses/Error"

  /api/auth/logout:
    post:
      summary: End the current console session
      description: >-
        Revokes the caller's console session server-side and clears the session
        cookies. The session is revoked rather than merely forgotten, so a copy
        of the token cannot keep authenticating.
      operationId: logout
      tags:
        - Auth
      security:
        - HttpBearerAuth: []
      responses:
        "204":
          description: Session ended
        default:
          $ref: "#/components/responses/Error"

  /api/auth/refresh:
    post:
      summary: Extend the current console session
      description: >-
        Extends the idle window of the caller's own session and reissues the
        session cookie. Answers 401 when the session is gone (revoked or
        expired), and 403 when it is alive but cannot be extended -- an
        impersonated session is recorded non-refreshable by construction.
      operationId: refreshSession
      tags:
        - Auth
      security:
        - HttpBearerAuth: []
      responses:
        "200":
          description: Session refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRefresh"
        default:
          $ref: "#/components/responses/Error"

  /api/auth/{driver}/webhook:
    post:
      summary: Auth provider webhook
      description: Webhook endpoint for external auth providers (e.g., Clerk user sync)
      operationId: authWebhook
      tags:
        - Auth
      parameters:
        - name: driver
          in: path
          required: true
          schema:
            type: string
            enum: [clerk]
          description: The authentication driver
      responses:
        "200":
          description: Webhook processed successfully
        default:
          $ref: "#/components/responses/Error"

  /api/auth/register:
    post:
      summary: Register with an email address and password
      description: >-
        Creates an account for an email address and sends a message confirming
        the address.


        The response is 204 and identical whether or not the address already has
        an account, whether or not registration is open to it, and whether or
        not any mail could be sent. Anything else would let the endpoint be used
        to test which addresses hold accounts here. When the address is already
        registered, the person who owns it is told so by email, which is the one
        channel that reaches only them.


        Whether registration is open at all is deployment configuration
        (AUTH_BASIC_REGISTRATION): open, invite-only, or disabled. A disabled
        deployment answers 404, which is a property of the deployment and not of
        the submitted address.
      operationId: registerWithPassword
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "204":
          description: Registration accepted
        default:
          $ref: "#/components/responses/Error"

  /api/auth/verify:
    post:
      summary: Confirm an email address
      description: >-
        Redeems a single-use verification token and marks the address confirmed.
        An unconfirmed account can still sign in; confirming it is what allows
        the address to be linked to another identity provider later.
      operationId: verifyEmail
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionTokenRequest"
      responses:
        "204":
          description: Address confirmed
        default:
          $ref: "#/components/responses/Error"

  /api/auth/password/reset:
    post:
      summary: Request a password reset
      description: >-
        Sends a single-use reset link to the address, if it has an account with
        a password. The response is 204 regardless, so the endpoint cannot be
        used to discover which addresses hold accounts.
      operationId: requestPasswordReset
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "204":
          description: Request accepted
        default:
          $ref: "#/components/responses/Error"

  /api/auth/password/reset/confirm:
    post:
      summary: Complete a password reset
      description: >-
        Redeems a single-use reset token and sets a new password. Every existing
        session of that account is revoked: a reset is the remedy for a
        compromised account, so it has to end whatever sessions the attacker
        holds.
      operationId: confirmPasswordReset
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequest"
      responses:
        "204":
          description: Password changed
        default:
          $ref: "#/components/responses/Error"

  /api/admin/profile/password:
    post:
      summary: Change your own password
      description: >-
        Sets a new password for the authenticated admin. The current password is
        required, so a borrowed session cannot lock its owner out. Every OTHER
        session of the account is revoked and the caller's own is kept.
      operationId: changePassword
      tags:
        - Auth
      security:
        - HttpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed
        default:
          $ref: "#/components/responses/Error"

  /api/admin/projects/{projectID}/campaigns:
    get:
      summary: List campaigns
      description: Retrieves a list of campaigns with optional filtering
      operationId: listCampaigns
      tags:
        - Campaigns
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/IncludeDeleted"
      responses:
        "200":
          $ref: "#/components/responses/CampaignListResponse"
        default:
          $ref: "#/components/responses/Error"

    post:
      summary: Create campaign
      description: Creates a new campaign
      operationId: createCampaign
      tags:
        - Campaigns
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCampaign"
      responses:
        "201":
          description: Campaign created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        default:
          $ref: "#/components/responses/Error"

  /api/admin/projects/{projectID}/campaigns/{campaignID}:
    get:
      summary: Get campaign by ID
      description: Retrieves a specific campaign with its templates and provider information
      operationId: getCampaign
      tags:
        - Campaigns
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: campaignID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The campaign ID
      responses:
        "200":
          description: Campaign retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/Campaign"
        default:
          $ref: "#/components/responses/Error"

    patch:
      summary: Update campaign
      description: Updates campaign properties such as name and provider
      operationId: updateCampaign
      tags:
        - Campaigns
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: campaignID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The campaign ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCampaign"
      responses:
        "200":
          description: Campaign updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        default:
          $ref: "#/components/responses/Error"

    delete:
      summary: Delete campaign
      description: Archives a campaign by setting its deleted_at timestamp
      operationId: deleteCampaign
      tags:
        - Campaigns
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: campaignID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The campaign ID
      responses:
        "204":
          description: Campaign deleted successfully
        default:
          $ref: "#/components/responses/Error"

  /api/admin/projects/{projectID}/campaigns/{campaignID}/unarchive:
    post:
      summary: Unarchive campaign
      description: Restores an archived campaign by clearing its deleted_at timestamp
      operationId: unarchiveCampaign
      tags:
        - Campaigns
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: campaignID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The campaign ID
      responses:
        "204":
          description: Campaign unarchived successfully
        default:
          $ref: "#/components/responses/Error"

  /api/admin/projects/{projectID}/campaigns/{campaignID}/templates:
    post:
      summary: Create template
      description: Creates a new template for a campaign
      operationId: createTemplate
      tags:
        - Templates
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: campaignID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The campaign ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTemplate"
      responses:
        "201":
          description: Template created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        default:
          $ref: "#/components/responses/Error"

  /api/admin/projects/{projectID}/campaigns/{campaignID}/templates/{templateID}:
    get:
      summary: Get template by ID
      description: Retrieves a specific template with its content and editor data
      operationId: getTemplate
      tags:
        - Templates
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: campaignID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The campaign ID
        - name: templateID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The template ID
      responses:
        "200":
          description: Template retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/Template"
        default:
          $ref: "#/components/responses/Error"

    patch:
      summary: Update template
      description: Updates template properties and content
      operationId: updateTemplate
      tags:
        - Templates
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: campaignID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The campaign ID
        - name: templateID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The template ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTemplate"
      responses:
        "200":
          description: Template updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        default:
          $ref: "#/components/responses/Error"

    delete:
      summary: Delete template
      description: Deletes a template
      operationId: deleteTemplate
      tags:
        - Templates
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: campaignID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The campaign ID
        - name: templateID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The template ID
      responses:
        "204":
          description: Template deleted successfully
        default:
          $ref: "#/components/responses/Error"

  /api/admin/projects/{projectID}/campaigns/{campaignID}/templates/{templateID}/test:
    post:
      summary: Send test
      description: Sends a test message using the template to the specified recipient
      operationId: sendTest
      tags:
        - Templates
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: campaignID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The campaign ID
        - name: templateID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The template ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendTest"
      responses:
        "204":
          description: Test sent successfully
        default:
          $ref: "#/components/responses/Error"

  /api/admin/projects/{projectID}/campaigns/{campaignID}/duplicate:
    post:
      summary: Duplicate campaign
      description: Creates a copy of the campaign with all its templates
      operationId: duplicateCampaign
      tags:
        - Campaigns
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: campaignID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The campaign ID to duplicate
      responses:
        "201":
          description: Campaign duplicated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        default:
          $ref: "#/components/responses/Error"

  /api/admin/projects/{projectID}/campaigns/{campaignID}/users:
    get:
      summary: Get campaign users
      description: Retrieves the list of users associated with a campaign
      operationId: getCampaignUsers
      tags:
        - Campaigns
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: campaignID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The campaign ID
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Campaign users retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - total
                  - limit
                  - offset
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CampaignUser"
                  total:
                    type: integer
                    minimum: 0
                  limit:
                    type: integer
                  offset:
                    type: integer
        default:
          $ref: "#/components/responses/Error"

  /api/admin/projects/{projectID}/lists:
    get:
      summary: List lists
      description: Retrieves a paginated list of lists for a project
      operationId: listLists
      tags:
        - Lists
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/IncludeDeleted"
      responses:
        "200":
          $ref: "#/components/responses/ListListResponse"
        default:
          $ref: "#/components/responses/Error"

    post:
      summary: Create list
      description: Creates a new list
      operationId: createList
      tags:
        - Lists
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateList"
      responses:
        "201":
          description: List created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List"
        default:
          $ref: "#/components/responses/Error"

  /api/admin/projects/{projectID}/lists/{listID}:
    get:
      summary: Get list by ID
      description: Retrieves a specific list
      operationId: getList
      tags:
        - Lists
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: listID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The list ID
      responses:
        "200":
          description: List retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List"
        default:
          $ref: "#/components/responses/Error"

    patch:
      summary: Update list
      description: Updates list properties such as name, rule, and tags
      operationId: updateList
      tags:
        - Lists
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: listID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The list ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateList"
      responses:
        "200":
          description: List updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List"
        default:
          $ref: "#/components/responses/Error"

    delete:
      summary: Delete list
      description: Soft deletes a list
      operationId: deleteList
      tags:
        - Lists
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: listID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The list ID
      responses:
        "204":
          description: List deleted successfully
        default:
          $ref: "#/components/responses/Error"

  /api/admin/projects/{projectID}/lists/{listID}/unarchive:
    post:
      summary: Unarchive list
      description: Restores an archived list by clearing its deleted_at timestamp
      operationId: unarchiveList
      tags:
        - Lists
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: listID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The list ID
      responses:
        "204":
          description: List unarchived successfully
        default:
          $ref: "#/components/responses/Error"

  /api/admin/projects/{projectID}/lists/{listID}/duplicate:
    post:
      summary: Duplicate list
      description: Creates a copy of the list
      operationId: duplicateList
      tags:
        - Lists
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: listID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The list ID to duplicate
      responses:
        "201":
          description: List duplicated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List"
        default:
          $ref: "#/components/responses/Error"

  /api/admin/projects/{projectID}/lists/{listID}/users:
    get:
      summary: Get list users
      description: Retrieves the list of users associated with a list
      operationId: getListUsers
      tags:
        - Lists
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: listID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The list ID
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: List users retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        default:
          $ref: "#/components/responses/Error"

  /api/admin/projects/{projectID}/lists/{listID}/users/preview:
    get:
      summary: Preview list users
      description: Returns a limited preview of users that match the list's draft rule without modifying list membership
      operationId: previewListUsers
      tags:
        - Lists
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: listID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The list ID
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Preview users retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        default:
          $ref: "#/components/responses/Error"

    post:
      summary: Import list users
      description: Imports users to a static list from a CSV file
      operationId: importListUsers
      tags:
        - Lists
      security:
        - HttpBearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: listID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The list ID
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV file containing user data. Must include external_id column.
      responses:
        "204":
          description: Users imported successfully
        default:
          $ref: "#/components/responses/Error"

  /api/admin/projects:
    get:
      summary: List projects
      description: Retrieves a paginated list of projects accessible to the authenticated admin
      operationId: listProjects
      tags:
        - Projects
      security:
        - HttpBearerAuth: []
