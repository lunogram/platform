<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Unsubscribed</title>
        <link rel="stylesheet" href="/static/styles.css" />
        <script>
            if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
                document.documentElement.classList.add("dark");
            }
        </script>
    </head>
    <body class="bg-white dark:bg-zinc-950 min-h-screen py-12 px-4 antialiased">
        <div class="max-w-md mx-auto">
            <div class="mb-8">
                <h1
                    class="text-xl font-semibold tracking-tight text-zinc-900 dark:text-zinc-50"
                >
                    Unsubscribed
                </h1>
                <p class="text-sm text-zinc-500 dark:text-zinc-400 mt-1">
                    Your preferences have been updated.
                </p>
            </div>

            <div
                class="rounded-lg border border-zinc-200 dark:border-zinc-800 p-6"
            >
                <div class="flex items-start gap-4">
                    <div
                        class="flex-shrink-0 w-10 h-10 rounded-full bg-zinc-100 dark:bg-zinc-800 flex items-center justify-center"
                    >
                        <svg
                            class="w-5 h-5 text-zinc-900 dark:text-zinc-50"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M5 13l4 4L19 7"
                            />
                        </svg>
                    </div>
                    <div>
                        <p
                            class="text-sm font-medium text-zinc-900 dark:text-zinc-50"
                        >
                            You have been unsubscribed
                        </p>
                        <p
                            class="text-sm text-zinc-500 dark:text-zinc-400 mt-1"
                        >
                            You will no longer receive these communications.
                        </p>
                    </div>
                </div>
            </div>

            <p
                class="text-center text-xs text-zinc-400 dark:text-zinc-600 mt-8"
            >
                Powered by Lunogram
            </p>
        </div>
    </body>
</html>
