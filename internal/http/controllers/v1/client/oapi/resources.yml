openapi: 3.0.3
info:
  title: Lunogram Public API
  description: API for ingesting data such as user profiles and events.
  version: 1.0.0

paths:
  /api/client/projects/{projectID}/users:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    post:
      summary: Upsert user
      description: Used by client libraries to create or update a user profile. The project is taken from the projectID path parameter.
      operationId: upsertUserClient
      tags:
        - Client
      security:
        - HttpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentifyRequest"
      responses:
        "200":
          description: User upserted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete user
      description: |
        Used by client libraries to delete a user by external_id or anonymous_id.
        The project is taken from the projectID path parameter.
      operationId: deleteUserClient
      tags:
        - Client
      security:
        - HttpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteUserRequest"
      responses:
        "204":
          description: User deleted successfully
        default:
          $ref: "#/components/responses/Error"

  /api/client/projects/{projectID}/users/events:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    post:
      summary: Post user events
      description: |
        Used by client libraries to trigger events for a user that can be used to execute a step in a journey or update a virtual list.
        Multiple events can be sent in a single request and are processed asynchronously.
        Each event is handled independently: if one event fails to be accepted or processed, other events in the same request may still be published successfully.
        Clients requiring deterministic retry or recovery behavior must submit events individually.
        The project is taken from the projectID path parameter.
      operationId: postUserEvents
      tags:
        - Client
      security:
        - HttpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostEventsRequest"
      responses:
        "202":
          description: Events accepted for asynchronous processing
        default:
          $ref: "#/components/responses/Error"

  /api/client/projects/{projectID}/users/inbox:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    post:
      summary: Create user inbox messages
      description: Creates one or more inbox messages for users identified by external identifiers. Messages are processed asynchronously.
      operationId: postUserInboxMessages
      tags:
        - Client
      security:
        - HttpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostUserInboxMessagesRequest"
      responses:
        "202":
          description: Inbox messages accepted for asynchronous processing
        default:
          $ref: "#/components/responses/Error"
    get:
      summary: Query user inbox messages
      description: Returns visible, non-expired inbox messages for a user identified by source and external_id.
      operationId: getUserInbox
      tags:
        - Client
      security:
        - HttpBearerAuth: []
      parameters:
        - name: source
          in: query
          required: true
          schema:
            type: string
        - name: external_id
          in: query
          required: true
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [unread, read, archived]
        - name: tags
          in: query
          schema:
            type: string
          description: Comma-separated tag filter. All listed tags must be present.
        - name: message_source
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: integer
        - name: channel
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Channel"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: User inbox messages retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxMessageList"
        default:
          $ref: "#/components/responses/Error"

  /api/client/projects/{projectID}/users/inbox/count:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      summary: Count user inbox messages
      description: Returns unread and total visible inbox message counts for a user.
      operationId: getUserInboxCount
      tags:
        - Client
      security:
        - HttpBearerAuth: []
      parameters:
        - name: source
          in: query
          required: true
          schema:
            type: string
        - name: external_id
          in: query
          required: true
          schema:
            type: string
        - name: channel
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Channel"
      responses:
        "200":
          description: User inbox count retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxCount"
        default:
          $ref: "#/components/responses/Error"

  /api/client/projects/{projectID}/users/inbox/read:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    post:
      summary: Mark user inbox messages read
      description: Marks one or more user inbox messages as read. Processed asynchronously.
      operationId: postUserInboxRead
      tags:
        - Client
      security:
        - HttpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInboxMessageEvents"
      responses:
        "202":
          description: Inbox read events accepted for asynchronous processing
        default:
          $ref: "#/components/responses/Error"

  /api/client/projects/{projectID}/users/inbox/archived:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    post:
      summary: Mark user inbox messages archived
      description: Marks one or more user inbox messages as archived. Processed asynchronously.
      operationId: postUserInboxArchived
      tags:
        - Client
      security:
        - HttpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInboxMessageEvents"
      responses:
        "202":
          description: Inbox archived events accepted for asynchronous processing
        default:
          $ref: "#/components/responses/Error"

  /api/client/projects/{projectID}/organizations:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    post:
      summary: Upsert organization
      description: |
        Used by client libraries to create or update an organization by external_id.
        The project is taken from the projectID path parameter.
      operationId: upsertOrganizationClient
      tags:
        - Client
      security:
        - HttpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationRequest"
      responses:
        "200":
          description: Organization upserted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete organization
      description: |
        Used by client libraries to delete an organization by external_id.
        This will also remove all organization memberships.
        The project is taken from the projectID path parameter.
      operationId: deleteOrganizationClient
      tags:
        - Client
      security:
        - HttpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteOrganizationRequest"
      responses:
        "204":
          description: Organization deleted successfully
        default:
          $ref: "#/components/responses/Error"

  /api/client/projects/{projectID}/organizations/users:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    post:
      summary: Add user to organization
      description: |
        Used by client libraries to add a user to an organization with optional org-specific data.
        Both organization and user are identified by their external_id.
        The project is taken from the projectID path parameter.
      operationId: addOrganizationUserClient
      tags:
        - Client
      security:
        - HttpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationUserRequest"
      responses:
        "200":
          description: User added to organization successfully
        default:
          $ref: "#/components/responses/Error"

    delete:
      summary: Remove user from organization
      description: |
        Used by client libraries to remove a user from an organization.
        Both organization and user are identified by their external_id.
        The project is taken from the projectID path parameter.
      operationId: removeOrganizationUserClient
      tags:
        - Client
      security:
        - HttpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveOrganizationUserRequest"
      responses:
        "204":
          description: User removed from organization successfully
        default:
          $ref: "#/components/responses/Error"

  /api/client/projects/{projectID}/users/scheduled:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    post:
      summary: Upsert user scheduled
      description: |
        Used by client libraries to create or update a scheduled resource for a user.
        The user is identified by external_id or anonymous_id.
        This triggers journey entrance recalculation for any journeys that depend on the scheduled resource.
        The project is taken from the projectID path parameter.
      operationId: upsertUserScheduledClient
      tags:
        - Client
      security:
        - HttpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertUserScheduledRequest"
      responses:
        "202":
          description: Scheduled resource accepted for asynchronous processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledAccepted"
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete user scheduled
      description: |
        Used by client libraries to delete all scheduled instances for a user with a given scheduled resource name.
        The user is identified by external_id or anonymous_id.
        This cancels any pending journey entrance states that depend on the scheduled resource.
        The project is taken from the projectID path parameter.
      operationId: deleteUserScheduledClient
      tags:
        - Client
      security:
        - HttpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteUserScheduledRequest"
      responses:
        "200":
          description: User scheduled deleted successfully
        default:
          $ref: "#/components/responses/Error"

  /api/client/projects/{projectID}/organizations/scheduled:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    post:
      summary: Upsert organization scheduled
      description: |
        Used by client libraries to create or update a scheduled resource for an organization.
        The organization is identified by external_id.
        This triggers journey entrance recalculation for any journeys that depend on the scheduled resource.
        The project is taken from the projectID path parameter.
      operationId: upsertOrganizationScheduledClient
      tags:
        - Client
      security:
        - HttpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertOrganizationScheduledRequest"
      responses:
        "202":
          description: Scheduled resource accepted for asynchronous processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledAccepted"
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete organization scheduled
      description: |
        Used by client libraries to delete all scheduled instances for an organization with a given scheduled resource name.
        The organization is identified by external_id.
        This cancels any pending journey entrance states that depend on the scheduled resource.
        The project is taken from the projectID path parameter.
      operationId: deleteOrganizationScheduledClient
      tags:
        - Client
      security:
        - HttpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteOrganizationScheduledRequest"
      responses:
        "200":
          description: Organization scheduled deleted successfully
        default:
          $ref: "#/components/responses/Error"

  /api/client/projects/{projectID}/organizations/events:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    post:
      summary: Post organization events
      description: |
        Used by client libraries to trigger events on an organization.
        The organization is identified by external_id.
        Events are processed asynchronously and can trigger journeys for all users in the organization.
        The project is taken from the projectID path parameter.
      operationId: postOrganizationEventsClient
      tags:
        - Client
      security:
        - HttpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostOrganizationEventsRequest"
      responses:
        "202":
          description: Events accepted for asynchronous processing
        default:
          $ref: "#/components/responses/Error"

  /api/client/projects/{projectID}/organizations/inbox:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    post:
      summary: Create organization inbox messages
      description: Creates one or more inbox messages for organizations identified by external identifiers. Messages are processed asynchronously.
      operationId: postOrganizationInboxMessages
      tags:
        - Client
      security:
        - HttpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostOrganizationInboxMessagesRequest"
      responses:
        "202":
          description: Inbox messages accepted for asynchronous processing
        default:
          $ref: "#/components/responses/Error"
    get:
      summary: Query organization inbox messages
      description: Returns visible, non-expired inbox messages for an organization identified by source and external_id.
      operationId: getOrganizationInbox
      tags:
        - Client
      security:
        - HttpBearerAuth: []
      parameters:
        - name: source
          in: query
          required: true
          schema:
            type: string
        - name: external_id
          in: query
          required: true
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [unread, read, archived]
        - name: tags
          in: query
          schema:
            type: string
          description: Comma-separated tag filter. All listed tags must be present.
        - name: message_source
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: integer
        - name: channel
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Channel"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Organization inbox messages retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxMessageList"
        default:
          $ref: "#/components/responses/Error"

  /api/client/projects/{projectID}/organizations/inbox/count:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      summary: Count organization inbox messages
      description: Returns unread and total visible inbox message counts for an organization.
      operationId: getOrganizationInboxCount
      tags:
        - Client
      security:
        - HttpBearerAuth: []
      parameters:
        - name: source
          in: query
          required: true
          schema:
            type: string
        - name: external_id
          in: query
          required: true
          schema:
            type: string
        - name: channel
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Channel"
      responses:
        "200":
          description: Organization inbox count retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxCount"
        default:
          $ref: "#/components/responses/Error"

  /api/client/projects/{projectID}/organizations/inbox/read:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    post:
      summary: Mark organization inbox messages read
      description: Marks one or more organization inbox messages as read. Processed asynchronously.
      operationId: postOrganizationInboxRead
      tags:
        - Client
      security:
        - HttpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationInboxMessageEvents"
      responses:
        "202":
          description: Inbox read events accepted for asynchronous processing
        default:
          $ref: "#/components/responses/Error"

  /api/client/projects/{projectID}/organizations/inbox/archived:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    post:
      summary: Mark organization inbox messages archived
      description: Marks one or more organization inbox messages as archived. Processed asynchronously.
      operationId: postOrganizationInboxArchived
      tags:
        - Client
      security:
        - HttpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationInboxMessageEvents"
      responses:
        "202":
          description: Inbox archived events accepted for asynchronous processing
        default:
          $ref: "#/components/responses/Error"

  /unsubscribe/email:
    get:
      summary: Email unsubscribe page
      description: |
        Public endpoint for email unsubscribe links. Extracts user and campaign information
        from the encoded URL and displays an unsubscribe confirmation page.
      operationId: emailUnsubscribe
      tags:
        - Subscriptions
      parameters:
        - name: link
          in: query
          required: true
          schema:
            type: string
          description: Encoded unsubscribe link with user and campaign data
      responses:
        "200":
          description: Unsubscribe confirmation page
          content:
            text/html:
              schema:
                type: string

  /preferences/{projectID}/{userID}:
    get:
      summary: Subscription preferences page
      description: |
        Public endpoint for users to view and manage their subscription preferences.
        Shows all public subscriptions with current user state.
      operationId: getPreferencesPage
      tags:
        - Subscriptions
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: userID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The user ID
      responses:
        "200":
          description: Subscription preferences page
          content:
            text/html:
              schema:
                type: string

    post:
      summary: Update subscription preferences
      description: |
        Handles form submission to update user subscription preferences.
        Redirects back to preferences page with success indicator.
      operationId: updatePreferences
      tags:
        - Subscriptions
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: userID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The user ID
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                subscriptionIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Array of subscription IDs to keep subscribed
      responses:
        "302":
          description: Redirect to preferences page with success indicator
        "200":
          description: Success response (for htmx partial updates)
          content:
            text/html:
              schema:
                type: string

  /api/client/projects/{projectID}/users/devices:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    post:
      summary: Register device
      description: Register or update a device's push subscription. The project is taken from the projectID path parameter.
      operationId: registerDevice
      tags:
        - Client
      security:
        - HttpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRegistration"
      responses:
        "201":
          description: Device registered successfully
        default:
          $ref: "#/components/responses/Error"

  /api/client/projects/{projectID}/push/vapid:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      summary: Get VAPID public key
      description: Retrieves the VAPID public key for push notifications
      operationId: getVapidPublicKey
      tags:
        - Client
      security:
        - HttpBearerAuth: []
      responses:
        "200":
          description: VAPID public key retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VapidPublicKey"
        default:
          $ref: "#/components/responses/Error"

  /api/client/projects/{projectID}/auth-methods/{authMethodID}/sessions:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    post:
      summary: Mint a session token
      description: |
        Mints a short-lived session token for an end user, to be used from the
        client. Called server-side with an API key; the session's permissions are
        defined by the session auth method (policy) named in the path.
      operationId: createSession
      tags:
        - Client
      security:
        - HttpBearerAuth: []
      parameters:
        - name: authMethodID
          in: path
          required: true
          description: The session auth method (policy) that defines what the session may do.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSession"
      responses:
        "201":
          description: Session token minted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionToken"
        default:
          $ref: "#/components/responses/Error"

components:
  parameters:
    ProjectID:
      name: projectID
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The project the request acts on. Must match the project the presented credential is authorized for.

    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        x-go-type: PaginationLimit
      description: Maximum number of items to return

    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
        x-go-type: PaginationOffset
      description: Number of items to skip

  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    CreateSession:
      type: object
      description: Request to mint a session token for an end user.
      required:
        - user_id
      properties:
        user_id:
          type: string
          description: The end user's external identifier (the session subject).
          example: "user_12345"

    SessionToken:
      type: object
      required:
        - token
        - expires_at
      properties:
        token:
          type: string
          description: The signed session token (a bearer token for the Client API).
        expires_at:
          type: string
          format: date-time

    Channel:
      type: string
      enum: [email, sms, push, inbox]

    Problem:
      type: object
      required:
        - title
        - detail
      properties:
        title:
          type: string
          description: |
            A short summary of the problem type. Written in English and readable for engineers, usually not suited for non technical stakeholders and not localized.
          example: some title for the error situation
        detail:
          type: string
          description: |
            A human readable explanation specific to this occurrence of the problem that is helpful to locate the problem and give advice on how to proceed. Written in English and readable for engineers, usually not suited for non technical stakeholders and not localized.
          example: some description for the error situation

    ExternalID:
      type: object
      description: An external identifier with source and optional metadata
      required:
        - external_id
      properties:
        source:
          type: string
          default: "default"
          example: "default"
          description: Source of the identifier (e.g. "default", "anonymous", or a custom source). Defaults to "default" if not provided.
        external_id:
          type: string
          minLength: 1
          example: "user_12345"
          description: The external identifier value
        metadata:
          type: object
          additionalProperties: true
          nullable: true
          x-go-type: map[string]any
          description: Optional metadata associated with this identifier

    ExternalIDResponse:
      type: object
      description: An external identifier as returned in responses, including database ID and timestamps
      required:
        - id
        - source
        - external_id
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        source:
          type: string
          example: "default"
        external_id:
          type: string
          example: "user_12345"
        metadata:
          type: object
          additionalProperties: true
          nullable: true
          x-go-type: map[string]any
        created_at:
          type: string
          format: date-time
          example: "2025-11-19T14:18:42.960Z"
        updated_at:
          type: string
          format: date-time
          example: "2025-11-23T17:20:00.021Z"

    User:
      type: object
      required:
        - id
        - project_id
        - identifier
        - data
        - has_push_device
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
        project_id:
          type: string
