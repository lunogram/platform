openapi: 3.0.3
info:
  title: Lunogram Public API
  description: API for ingesting data such as user profiles and events.
  version: 1.0.0

paths:
  /api/client/users:
    post:
      summary: Upsert user
      description: Used by client libraries to create or update a user profile. The project is determined from the API key.
      operationId: upsertUserClient
      tags:
        - Client
      security:
        - HttpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentifyRequest"
      responses:
        "200":
          description: User upserted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete user
      description: |
        Used by client libraries to delete a user by external_id or anonymous_id.
        The project is determined from the API key.
      operationId: deleteUserClient
      tags:
        - Client
      security:
        - HttpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteUserRequest"
      responses:
        "204":
          description: User deleted successfully
        default:
          $ref: "#/components/responses/Error"

  /api/client/users/events:
    post:
      summary: Post user events
      description: |
        Used by client libraries to trigger events for a user that can be used to execute a step in a journey or update a virtual list.
        Multiple events can be sent in a single request and are processed asynchronously.
        Each event is handled independently: if one event fails to be accepted or processed, other events in the same request may still be published successfully.
        Clients requiring deterministic retry or recovery behavior must submit events individually.
        The project is determined from the API key.
      operationId: postUserEvents
      tags:
        - Client
      security:
        - HttpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostEventsRequest"
      responses:
        "202":
          description: Events accepted for asynchronous processing
        default:
          $ref: "#/components/responses/Error"

  /api/client/organizations:
    post:
      summary: Upsert organization
      description: |
        Used by client libraries to create or update an organization by external_id.
        The project is determined from the API key.
      operationId: upsertOrganizationClient
      tags:
        - Client
      security:
        - HttpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationRequest"
      responses:
        "200":
          description: Organization upserted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete organization
      description: |
        Used by client libraries to delete an organization by external_id.
        This will also remove all organization memberships.
        The project is determined from the API key.
      operationId: deleteOrganizationClient
      tags:
        - Client
      security:
        - HttpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteOrganizationRequest"
      responses:
        "204":
          description: Organization deleted successfully
        default:
          $ref: "#/components/responses/Error"

  /api/client/organizations/users:
    post:
      summary: Add user to organization
      description: |
        Used by client libraries to add a user to an organization with optional org-specific data.
        Both organization and user are identified by their external_id.
        The project is determined from the API key.
      operationId: addOrganizationUserClient
      tags:
        - Client
      security:
        - HttpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationUserRequest"
      responses:
        "200":
          description: User added to organization successfully
        default:
          $ref: "#/components/responses/Error"

    delete:
      summary: Remove user from organization
      description: |
        Used by client libraries to remove a user from an organization.
        Both organization and user are identified by their external_id.
        The project is determined from the API key.
      operationId: removeOrganizationUserClient
      tags:
        - Client
      security:
        - HttpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveOrganizationUserRequest"
      responses:
        "204":
          description: User removed from organization successfully
        default:
          $ref: "#/components/responses/Error"

  /api/client/users/scheduled:
    post:
      summary: Upsert user scheduled
      description: |
        Used by client libraries to create or update a scheduled resource for a user.
        The user is identified by external_id or anonymous_id.
        This triggers journey entrance recalculation for any journeys that depend on the scheduled resource.
        The project is determined from the API key.
      operationId: upsertUserScheduledClient
      tags:
        - Client
      security:
        - HttpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertUserScheduledRequest"
      responses:
        "202":
          description: Scheduled resource accepted for asynchronous processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledAccepted"
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete user scheduled
      description: |
        Used by client libraries to delete all scheduled instances for a user with a given scheduled resource name.
        The user is identified by external_id or anonymous_id.
        This cancels any pending journey entrance states that depend on the scheduled resource.
        The project is determined from the API key.
      operationId: deleteUserScheduledClient
      tags:
        - Client
      security:
        - HttpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteUserScheduledRequest"
      responses:
        "200":
          description: User scheduled deleted successfully
        default:
          $ref: "#/components/responses/Error"

  /api/client/organizations/scheduled:
    post:
      summary: Upsert organization scheduled
      description: |
        Used by client libraries to create or update a scheduled resource for an organization.
        The organization is identified by external_id.
        This triggers journey entrance recalculation for any journeys that depend on the scheduled resource.
        The project is determined from the API key.
      operationId: upsertOrganizationScheduledClient
      tags:
        - Client
      security:
        - HttpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertOrganizationScheduledRequest"
      responses:
        "202":
          description: Scheduled resource accepted for asynchronous processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledAccepted"
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete organization scheduled
      description: |
        Used by client libraries to delete all scheduled instances for an organization with a given scheduled resource name.
        The organization is identified by external_id.
        This cancels any pending journey entrance states that depend on the scheduled resource.
        The project is determined from the API key.
      operationId: deleteOrganizationScheduledClient
      tags:
        - Client
      security:
        - HttpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteOrganizationScheduledRequest"
      responses:
        "200":
          description: Organization scheduled deleted successfully
        default:
          $ref: "#/components/responses/Error"

  /api/client/organizations/events:
    post:
      summary: Post organization events
      description: |
        Used by client libraries to trigger events on an organization.
        The organization is identified by external_id.
        Events are processed asynchronously and can trigger journeys for all users in the organization.
        The project is determined from the API key.
      operationId: postOrganizationEventsClient
      tags:
        - Client
      security:
        - HttpBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostOrganizationEventsRequest"
      responses:
        "202":
          description: Events accepted for asynchronous processing
        default:
          $ref: "#/components/responses/Error"

  /unsubscribe/email:
    get:
      summary: Email unsubscribe page
      description: |
        Public endpoint for email unsubscribe links. Extracts user and campaign information
        from the encoded URL and displays an unsubscribe confirmation page.
      operationId: emailUnsubscribe
      tags:
        - Subscriptions
      parameters:
        - name: link
          in: query
          required: true
          schema:
            type: string
          description: Encoded unsubscribe link with user and campaign data
      responses:
        "200":
          description: Unsubscribe confirmation page
          content:
            text/html:
              schema:
                type: string

  /preferences/{projectID}/{userID}:
    get:
      summary: Subscription preferences page
      description: |
        Public endpoint for users to view and manage their subscription preferences.
        Shows all public subscriptions with current user state.
      operationId: getPreferencesPage
      tags:
        - Subscriptions
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: userID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The user ID
      responses:
        "200":
          description: Subscription preferences page
          content:
            text/html:
              schema:
                type: string

    post:
      summary: Update subscription preferences
      description: |
        Handles form submission to update user subscription preferences.
        Redirects back to preferences page with success indicator.
      operationId: updatePreferences
      tags:
        - Subscriptions
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The project ID
        - name: userID
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The user ID
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                subscriptionIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Array of subscription IDs to keep subscribed
      responses:
        "302":
          description: Redirect to preferences page with success indicator
        "200":
          description: Success response (for htmx partial updates)
          content:
            text/html:
              schema:
                type: string

components:
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      required:
        - title
        - detail
      properties:
        title:
          type: string
          description: |
            A short summary of the problem type. Written in English and readable for engineers, usually not suited for non technical stakeholders and not localized.
          example: some title for the error situation
        detail:
          type: string
          description: |
            A human readable explanation specific to this occurrence of the problem that is helpful to locate the problem and give advice on how to proceed. Written in English and readable for engineers, usually not suited for non technical stakeholders and not localized.
          example: some description for the error situation

    User:
      type: object
      required:
        - id
        - project_id
        - anonymous_id
        - data
        - has_push_device
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
        project_id:
          type: string
          format: uuid
          example: "4c9d3163-7b64-4f9e-9068-d2e4b96be56b"
        anonymous_id:
          type: string
          example: "anon_abc123xyz"
        external_id:
          type: string
          example: "user_123"
        email:
          type: string
          format: email
          example: "user@example.com"
          x-go-type: string
        phone:
          type: string
          example: "+1234567890"
          description: E.164 formatted phone number
          x-go-type: string
          format: phone
        data:
          type: object
          additionalProperties: true
          x-go-type: map[string]any
          example:
            first_name: "John"
            last_name: "Doe"
        timezone:
          type: string
          example: "America/New_York"
        locale:
          type: string
          example: "en"
        has_push_device:
          type: boolean
          example: false
        version:
          type: integer
          example: 1
          x-go-type: int32
        created_at:
          type: string
          format: date-time
          example: "2025-11-19T14:18:42.960Z"
        updated_at:
          type: string
          format: date-time
          example: "2025-11-23T17:20:00.021Z"

    IdentifyRequest:
      type: object
      properties:
        external_id:
          type: string
          nullable: true
          example: "user_12345"
          description: External identifier for the user from your system
        anonymous_id:
          type: string
          nullable: true
          example: "anon_abc123"
          description: Anonymous identifier for the user
        email:
          type: string
          nullable: true
          format: email
          example: "user@example.com"
          x-go-type: string
        phone:
          type: string
          nullable: true
          example: "+31612345678"
          description: E.164 formatted phone number
          x-go-type: string
          format: phone
        timezone:
          type: string
          nullable: true
          example: "Europe/Amsterdam"
        locale:
          type: string
          nullable: true
          example: "nl-NL"
        data:
          type: object
          additionalProperties: true
          nullable: true
          x-go-type: map[string]any
          example:
            first_name: "John"
            last_name: "Smith"
            has_completed_onboarding: true
          description: User-specific attributes

    PostEventsRequest:
      type: array
      minItems: 1
      items:
        $ref: "#/components/schemas/Event"

    Event:
      type: object
      required:
        - name
        - data
      properties:
        name:
          type: string
          example: "purchase_completed"
          description: The name of the event
        anonymous_id:
          type: string
          nullable: true
          example: "anon_abc123"
          description: Anonymous identifier for the user
        external_id:
          type: string
          nullable: true
          example: "user_12345"
          description: External identifier for the user from your system
        data:
          type: object
          additionalProperties: true
          x-go-type: map[string]any
          example:
            product_id: "prod_789"
            amount: 99.99
          description: Event-specific data

    Organization:
      type: object
      required:
        - id
        - project_id
        - external_id
        - data
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
        project_id:
          type: string
          format: uuid
          example: "4c9d3163-7b64-4f9e-9068-d2e4b96be56b"
        external_id:
          type: string
          example: "org_123"
          description: External identifier for the organization from your system
        name:
          type: string
          example: "Acme Corp"
        data:
          type: object
          additionalProperties: true
          x-go-type: map[string]any
          example:
            industry: "technology"
            size: "enterprise"
        version:
          type: integer
          example: 1
          x-go-type: int32
        created_at:
          type: string
          format: date-time
          example: "2025-11-19T14:18:42.960Z"
        updated_at:
          type: string
          format: date-time
          example: "2025-11-23T17:20:00.021Z"

    OrganizationRequest:
      type: object
      required:
        - external_id
      properties:
        external_id:
          type: string
          example: "org_123"
          description: External identifier for the organization from your system
        name:
          type: string
          nullable: true
          example: "Acme Corp"
        data:
          type: object
          additionalProperties: true
          nullable: true
          x-go-type: map[string]any
          example:
            industry: "technology"
            size: "enterprise"

    OrganizationUserRequest:
      type: object
      required:
        - organization_external_id
        - user_external_id
      properties:
        organization_external_id:
          type: string
          example: "org_123"
          description: External identifier for the organization
        user_external_id:
          type: string
          example: "user_456"
          description: External identifier for the user
        data:
          type: object
          additionalProperties: true
          nullable: true
          x-go-type: map[string]any
          example:
            role: "admin"
            department: "engineering"
          description: Organization-specific data for this user

    DeleteUserRequest:
      type: object
      properties:
        external_id:
          type: string
          nullable: true
          example: "user_456"
          description: External identifier for the user
        anonymous_id:
          type: string
          nullable: true
          example: "anon_789"
          description: Anonymous identifier for the user

    DeleteOrganizationRequest:
      type: object
      required:
        - external_id
      properties:
        external_id:
          type: string
          example: "org_123"
          description: External identifier for the organization

    RemoveOrganizationUserRequest:
      type: object
      required:
        - organization_external_id
        - user_external_id
      properties:
        organization_external_id:
          type: string
          example: "org_123"
          description: External identifier for the organization
        user_external_id:
          type: string
          example: "user_456"
          description: External identifier for the user

    PostOrganizationEventsRequest:
      type: array
      minItems: 1
      items:
        $ref: "#/components/schemas/OrganizationEvent"

    OrganizationEvent:
      type: object
      required:
        - organization_external_id
        - name
      properties:
        organization_external_id:
          type: string
          example: "org_123"
          description: External identifier for the organization
        name:
          type: string
          example: "subscription_upgraded"
          description: The name of the event
        data:
          type: object
          additionalProperties: true
          nullable: true
          x-go-type: map[string]any
          example:
            plan: "enterprise"
            seats: 100
          description: Event-specific data

    UpsertUserScheduledRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "renewal_date"
          description: The name of the scheduled resource
        external_id:
          type: string
          nullable: true
          example: "user_12345"
          description: External identifier for the user from your system
        anonymous_id:
          type: string
          nullable: true
          example: "anon_abc123"
          description: Anonymous identifier for the user
        scheduled_at:
          type: string
          format: date-time
          nullable: true
          example: "2025-12-25T10:00:00Z"
          description: The time at which the scheduled resource is set to trigger. Required for single schedules.
        start_at:
          type: string
          format: date-time
          nullable: true
          example: "2025-01-01T00:00:00Z"
          description: Start time for recurring schedules. If omitted for recurring schedules, defaults to now.
        interval:
          type: string
          nullable: true
          example: "24h"
          description: Interval for recurring schedules. When set, the schedule type is automatically set to recurring.
        data:
          type: object
          additionalProperties: true
          nullable: true
          x-go-type: map[string]any
          example:
            plan: "pro"
            amount: 29.99
          description: Scheduled resource data

    UpsertOrganizationScheduledRequest:
      type: object
      required:
        - name
        - organization_external_id
      properties:
        name:
          type: string
          example: "contract_renewal"
          description: The name of the scheduled resource
        organization_external_id:
          type: string
          example: "org_123"
          description: External identifier for the organization from your system
        scheduled_at:
          type: string
          format: date-time
          nullable: true
          example: "2025-12-25T10:00:00Z"
          description: The time at which the scheduled resource is set to trigger. Required for single schedules.
        start_at:
          type: string
          format: date-time
          nullable: true
          example: "2025-01-01T00:00:00Z"
          description: Start time for recurring schedules. If omitted for recurring schedules, defaults to now.
        interval:
          type: string
          nullable: true
          example: "24h"
          description: Interval for recurring schedules. When set, the schedule type is automatically set to recurring.
        data:
          type: object
          additionalProperties: true
          nullable: true
          x-go-type: map[string]any
          example:
            contract_type: "enterprise"
            seats: 100
          description: Scheduled resource data

    DeleteUserScheduledRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "renewal_date"
          description: The name of the scheduled resource to delete
        external_id:
          type: string
          nullable: true
          example: "user_12345"
          description: External identifier for the user from your system
        anonymous_id:
          type: string
          nullable: true
          example: "anon_abc123"
          description: Anonymous identifier for the user

    ScheduledAccepted:
      type: object
      required:
        - id
        - name
        - scheduled_at
      properties:
        id:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
          description: The unique identifier for the scheduled instance
        name:
          type: string
          example: "trial_end"
          description: The name of the scheduled resource
        scheduled_at:
          type: string
          format: date-time
          example: "2025-01-15T09:00:00Z"
          description: The time at which the scheduled resource is set to trigger
        data:
          type: object
          additionalProperties: true
          nullable: true
          x-go-type: "map[string]any"
          description: Scheduled resource data

    DeleteOrganizationScheduledRequest:
      type: object
      required:
        - name
        - organization_external_id
      properties:
        name:
          type: string
          example: "contract_renewal"
          description: The name of the scheduled resource to delete
        organization_external_id:
          type: string
          example: "org_123"
          description: External identifier for the organization from your system

  securitySchemes:
    HttpBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for API authentication
